<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Quản Lý Đóng Gói</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { 
            margin: 0; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #f2f2f7; 
            -webkit-tap-highlight-color: transparent;
            color: #1f2937;
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .slide-up { animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Reset Input Number (No arrows) */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* Drag & Drop Visual Feedback */
        .drag-over { border: 2px dashed #3b82f6 !important; background-color: #eff6ff !important; transform: scale(1.02); transition: all 0.2s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 20, className = '', color = 'currentColor' }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px; stroke:${color}; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none;"></i>`;
                    iconRef.current.appendChild(tempDiv.firstChild);
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, size, color]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        const generateFormulaString = (items, packSizes) => {
            let parts = [];
            let total = 0;
            items.forEach(item => {
                const qty = parseInt(item.qty) || 0;
                const mult = parseInt(item.multiplier) || 1;
                const realQty = qty * mult;

                // Tự động bỏ qua các phần tử có số lượng 0
                if (realQty > 0) {
                    if (item.type === 'pack') {
                        const pack = packSizes.find(p => p.id === item.packId);
                        if (pack) {
                            parts.push(`${realQty} x ${pack.size}`);
                            total += realQty * pack.size;
                        }
                    } else {
                        parts.push(`${realQty}`);
                        total += realQty;
                    }
                }
            });
            return { formula: parts.join(' + '), total };
        };

        const downloadCSV = (dataStr, filename) => {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + dataStr;
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        function App() {
            const [activeTab, setActiveTab] = useState('tab2');
            const [packSizes, setPackSizes] = useState(() => {
                const saved = localStorage.getItem('packSizes');
                return saved ? JSON.parse(saved) : [
                    { id: 'p1', name: 'Thùng Lớn', size: 24 },
                    { id: 'p2', name: 'Hộp Vừa', size: 12 },
                    { id: 'p3', name: 'Lốc Nhỏ', size: 6 }
                ];
            });
            
            const [toastMsg, setToastMsg] = useState('');
            const [hasUpdate, setHasUpdate] = useState(true);

            useEffect(() => { localStorage.setItem('packSizes', JSON.stringify(packSizes)); }, [packSizes]);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2000);
            };

            return (
                <div className="flex justify-center items-center min-h-screen md:p-4 bg-gray-300">
                    <div className="w-full h-[100dvh] md:max-w-[400px] md:h-[800px] bg-[#f2f2f7] md:rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative md:border-[8px] border-gray-900">
                        
                        {/* Header Tinh Gọn */}
                        <div className="bg-white/80 backdrop-blur-md pt-[env(safe-area-inset-top,40px)] md:pt-6 pb-3 px-6 z-20 flex justify-center items-end shrink-0 border-b border-gray-200/50">
                            <h1 className="text-[17px] font-bold tracking-tight text-gray-900">
                                {activeTab === 'tab1' && 'Tính Xuôi (Kho)'}
                                {activeTab === 'tab2' && 'Chia Ngược (Đóng gói)'}
                                {activeTab === 'tab3' && 'Cài Đặt'}
                            </h1>
                        </div>

                        {/* Toast */}
                        {toastMsg && (
                            <div className="absolute top-[env(safe-area-inset-top,80px)] left-1/2 transform -translate-x-1/2 z-50 bg-gray-800/90 backdrop-blur text-white px-4 py-2.5 rounded-full shadow-lg text-[13px] font-semibold fade-in flex items-center gap-2 whitespace-nowrap">
                                <Icon name="info" size={16}/> {toastMsg}
                            </div>
                        )}

                        {/* Content Area - Tăng pb lên 130px để nội dung không bị che bởi thanh menu nổi */}
                        <div className="flex-1 overflow-y-auto pb-[130px] hide-scrollbar relative">
                            {activeTab === 'tab1' && <Tab1Calculator packSizes={packSizes} showToast={showToast} />}
                            {activeTab === 'tab2' && <Tab2Divider packSizes={packSizes} showToast={showToast} />}
                            {activeTab === 'tab3' && <Tab3Settings packSizes={packSizes} setPackSizes={setPackSizes} showToast={showToast} hasUpdate={hasUpdate} setHasUpdate={setHasUpdate} />}
                        </div>

                        {/* Bottom Navigation - Nổi lên tránh Home Indicator */}
                        <div className="absolute bottom-[env(safe-area-inset-bottom,20px)] left-4 right-4 z-30 pb-2">
                            <div className="bg-white/90 backdrop-blur-xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-200/50 rounded-full flex justify-around p-1.5">
                                <NavButton icon="calculator" label="Tính Xuôi" isActive={activeTab === 'tab1'} onClick={() => setActiveTab('tab1')} />
                                <NavButton icon="package-open" label="Chia Ngược" isActive={activeTab === 'tab2'} onClick={() => setActiveTab('tab2')} />
                                <NavButton icon="settings" label="Cài Đặt" isActive={activeTab === 'tab3'} onClick={() => setActiveTab('tab3')} hasBadge={hasUpdate} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function NavButton({ icon, label, isActive, onClick, hasBadge }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-[70px] py-2 relative transition-all duration-300 rounded-full ${isActive ? 'bg-blue-50 text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
                    <Icon name={icon} size={22} className={`transition-transform duration-300 ${isActive ? 'scale-110' : ''}`} />
                    <span className={`text-[10px] mt-1 ${isActive ? 'font-bold' : 'font-medium'}`}>{label}</span>
                    {hasBadge && !isActive && <div className="absolute top-1 right-3 w-2 h-2 bg-red-500 border-2 border-white rounded-full"></div>}
                </button>
            );
        }

        function RowItem({ item, packSizes, updateItem, removeItem, onDragStart, onDragOver, onDrop }) {
            const isPack = item.type === 'pack';
            const mult = item.multiplier || 1;
            const packSize = isPack ? (packSizes.find(p => p.id === item.packId)?.size || 0) : 1;
            const itemTotal = (parseInt(item.qty) || 0) * mult * packSize;
            
            const [showMultModal, setShowMultModal] = useState(false);

            const handleQtyChange = (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                updateItem(item.id, 'qty', val === '' ? 0 : parseInt(val));
            };

            const applyResetToX1 = () => {
                const newQty = (parseInt(item.qty) || 0) * mult;
                updateItem(item.id, 'qty', newQty);
                updateItem(item.id, 'multiplier', 1);
                setShowMultModal(false);
            };

            return (
                <div 
                    draggable={!item.isLocked && !!onDragStart}
                    onDragStart={(e) => onDragStart && onDragStart(e, item.id)}
                    onDragOver={(e) => onDragOver && onDragOver(e, item)}
                    onDrop={(e) => onDrop && onDrop(e, item.id)}
                    className={`relative flex items-center p-2 rounded-2xl border transition-all duration-200 ${item.isLocked ? 'bg-gray-50 border-gray-100 opacity-80' : (item.qty === 0 ? 'bg-yellow-50/50 border-yellow-200' : 'bg-white border-gray-200 shadow-sm')}`}
                >
                    {/* Cụm Multiplier / Drag Handle */}
                    <div className="shrink-0 flex flex-col items-center mr-2 relative z-10">
                        {item.isLocked ? (
                            <button onClick={() => updateItem(item.id, 'isLocked', false)} className="p-2 rounded-xl bg-gray-100 text-red-500">
                                <Icon name="lock" size={16}/>
                            </button>
                        ) : (
                            <button 
                                onClick={() => setShowMultModal(!showMultModal)} 
                                className={`w-9 h-10 flex flex-col items-center justify-center rounded-[10px] transition-colors cursor-grab active:cursor-grabbing border ${mult > 1 ? 'bg-indigo-100 border-indigo-200 text-indigo-700' : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100'}`}
                            >
                                <Icon name="grip-horizontal" size={14} className="mb-0.5 opacity-50"/>
                                <span className="text-[10px] font-bold leading-none">x{mult}</span>
                            </button>
                        )}
                        
                        {/* Popover Nhập Hệ Số Tinh Tế */}
                        {showMultModal && !item.isLocked && (
                            <div className="absolute left-10 top-0 bg-white border border-gray-200 shadow-xl rounded-xl p-2 flex items-center gap-2 slide-up w-[180px]">
                                <span className="text-[11px] font-semibold text-gray-500">Hệ số:</span>
                                <input 
                                    type="text" inputMode="numeric" pattern="[0-9]*" 
                                    value={mult} 
                                    onFocus={(e) => e.target.select()} 
                                    onChange={e => updateItem(item.id, 'multiplier', parseInt(e.target.value.replace(/[^0-9]/g, ''))||1)} 
                                    className="w-10 text-center font-bold text-sm outline-none text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-md py-1" 
                                />
                                {mult > 1 && (
                                    <button onClick={applyResetToX1} className="text-[10px] font-bold bg-indigo-600 text-white px-2 py-1.5 rounded-lg active:scale-95">
                                        Về x1
                                    </button>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Tên & Dropdown */}
                    <div className="flex-1 min-w-0 mr-2">
                        {isPack ? (
                            <select disabled={item.isLocked} value={item.packId} onChange={(e) => updateItem(item.id, 'packId', e.target.value)} className={`w-full bg-transparent text-[14px] font-semibold outline-none truncate appearance-none ${item.isLocked ? 'text-gray-500' : 'text-gray-900'}`}>
                                {packSizes.map(p => <option key={p.id} value={p.id}>{p.name} ({p.size})</option>)}
                            </select>
                        ) : (
                            <span className={`w-full text-[14px] font-semibold truncate block ${item.isLocked ? 'text-gray-500' : 'text-orange-600'}`}>Hàng Lẻ</span>
                        )}
                    </div>

                    {/* Bộ Stepper Tinh Gọn */}
                    <div className={`flex items-center rounded-xl overflow-hidden border ${item.isLocked ? 'border-transparent bg-gray-50' : 'border-gray-200 bg-white'} shrink-0 h-9`}>
                        <button disabled={item.isLocked} onClick={() => updateItem(item.id, 'qty', Math.max(0, (parseInt(item.qty)||0) - 1))} className="w-8 h-full flex items-center justify-center text-gray-500 bg-gray-50 active:bg-gray-200 border-r border-gray-200 font-medium">-</button>
                        <input 
                            disabled={item.isLocked} type="text" inputMode="numeric" pattern="[0-9]*" 
                            value={item.qty===0?'':item.qty} onFocus={(e) => e.target.select()} onChange={handleQtyChange} 
                            className={`w-10 h-full text-center text-[15px] font-bold bg-transparent outline-none p-0 ${item.isLocked ? 'text-gray-500' : 'text-gray-900'}`} placeholder="0" 
                        />
                        <button disabled={item.isLocked} onClick={() => updateItem(item.id, 'qty', (parseInt(item.qty)||0) + 1)} className="w-8 h-full flex items-center justify-center text-gray-500 bg-gray-50 active:bg-gray-200 border-l border-gray-200 font-medium">+</button>
                    </div>

                    {/* Tổng & Xóa (Stacked) */}
                    <div className="w-[48px] flex flex-col items-end justify-center shrink-0 ml-1">
                        <span className={`text-[13px] font-bold leading-none mb-1 ${isPack ? 'text-blue-600' : 'text-orange-600'}`}>{itemTotal}</span>
                        <div className="flex gap-1">
                            {!item.isLocked && <button onClick={() => updateItem(item.id, 'isLocked', true)} className="text-gray-300 hover:text-gray-500 active:scale-90"><Icon name="lock" size={12}/></button>}
                            <button onClick={() => removeItem(item.id)} className="text-gray-300 hover:text-red-500 active:scale-90"><Icon name="trash-2" size={14}/></button>
                        </div>
                    </div>
                </div>
            );
        }

        function Tab1Calculator({ packSizes, showToast }) {
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('t1Items');
                return saved ? JSON.parse(saved) : [{ id: Date.now(), type: 'pack', packId: packSizes[0]?.id || '', qty: 0, multiplier: 1, isLocked: false }];
            });
            
            const [saveName, setSaveName] = useState('');
            const [showHistory, setShowHistory] = useState(false);
            const [historyList, setHistoryList] = useState(() => { const s = localStorage.getItem('t1Hist'); return s ? JSON.parse(s) : []; });
            
            // Auto-save trạng thái hiện tại
            useEffect(() => { localStorage.setItem('t1Items', JSON.stringify(items)); }, [items]);
            useEffect(() => { localStorage.setItem('t1Hist', JSON.stringify(historyList)); }, [historyList]);

            const addItem = (type) => setItems([...items, { id: Date.now() + Math.random(), type, packId: type === 'pack' ? (packSizes[0]?.id || '') : null, qty: 0, multiplier: 1, isLocked: false }]);
            const updateItem = (id, field, value) => setItems(items.map(i => i.id === id ? { ...i, [field]: value } : i));
            const removeItem = (id) => setItems(items.filter(i => i.id !== id));
            
            const resetForm = () => {
                setItems([{ id: Date.now(), type: 'pack', packId: packSizes[0]?.id || '', qty: 0, multiplier: 1, isLocked: false }]);
                setSaveName('');
                showToast("Đã làm mới!");
            };

            const total = useMemo(() => items.reduce((acc, item) => {
                const mult = item.multiplier || 1;
                const qty = parseInt(item.qty) || 0;
                return acc + (item.type === 'pack' ? qty * mult * (packSizes.find(x => x.id === item.packId)?.size || 0) : qty * mult);
            }, 0), [items, packSizes]);

            const handleSave = () => {
                if (!saveName.trim()) { showToast("Nhập tên để lưu!"); return; }
                
                // Lọc bỏ các mục có số lượng = 0 trước khi lưu
                const validItems = items.filter(item => (parseInt(item.qty)||0) > 0);
                
                const { formula } = generateFormulaString(validItems, packSizes);
                const finalStr = formula ? `${formula} = ${total.toLocaleString()}` : '0';
                
                setHistoryList([{ id: Date.now(), name: saveName, date: new Date().toLocaleString('vi-VN'), data: validItems, total, formulaStr: finalStr }, ...historyList]);
                setSaveName(''); showToast("Đã lưu (lọc số 0)!");
            };

            const exportCSV = () => {
                let str = "Loại,Tên,Quy Cách,Hệ Số,Số Lượng,Tổng\n";
                // Lọc số 0 khi xuất file
                const validItems = items.filter(item => (parseInt(item.qty)||0) > 0);
                
                validItems.forEach(it => {
                    const isPack = it.type === 'pack';
                    const p = isPack ? packSizes.find(x => x.id === it.packId) : null;
                    const size = p ? p.size : 1;
                    const mult = it.multiplier || 1;
                    const rowTotal = it.qty * mult * size;
                    str += `${isPack ? 'Hộp' : 'Lẻ'},${p ? p.name : 'Lẻ'},${size},x${mult},${it.qty},${rowTotal}\n`;
                });
                str += `,,,,,TỔNG:,${total}`;
                downloadCSV(str, `TinhTong_${Date.now()}.csv`);
                showToast("Đã xuất Excel!");
            };

            return (
                <div className="p-3 space-y-3 fade-in relative">
                    {/* Hero Card Gọn Gàng */}
                    <div className="bg-gray-900 rounded-[24px] p-5 shadow-lg relative overflow-hidden">
                        <div className="absolute -top-6 -right-6 opacity-5"><Icon name="calculator" size={120} color="white"/></div>
                        <p className="text-gray-400 text-[11px] font-bold uppercase tracking-wider mb-1 z-10 relative">Tổng Thành Phẩm</p>
                        <h2 className="text-[40px] leading-none font-bold text-white tracking-tight z-10 relative mb-4">{total.toLocaleString()}</h2>
                        
                        {/* Toolbar Tinh Gọn */}
                        <div className="flex gap-1.5 z-10 relative">
                            <input 
                                type="text" placeholder="Tên để lưu..." value={saveName} 
                                onFocus={(e) => e.target.select()} onChange={(e) => setSaveName(e.target.value)} 
                                className="flex-1 px-3 bg-white/10 rounded-lg text-white placeholder-gray-400 text-[13px] font-medium outline-none backdrop-blur-sm border border-white/10" 
                            />
                            <button onClick={handleSave} className="bg-blue-600 text-white w-9 h-9 flex justify-center items-center rounded-lg active:scale-95"><Icon name="save" size={16}/></button>
                            <button onClick={exportCSV} className="bg-white/10 text-white w-9 h-9 flex justify-center items-center rounded-lg active:scale-95 border border-white/10"><Icon name="file-spreadsheet" size={16}/></button>
                            <button onClick={() => setShowHistory(true)} className="bg-white/10 text-white w-9 h-9 flex justify-center items-center rounded-lg active:scale-95 border border-white/10"><Icon name="history" size={16}/></button>
                            <button onClick={resetForm} className="bg-red-500/80 text-white w-9 h-9 flex justify-center items-center rounded-lg active:scale-95 border border-white/10"><Icon name="rotate-ccw" size={16}/></button>
                        </div>
                    </div>

                    {/* Segmented Buttons gọn gàng */}
                    <div className="flex gap-2">
                        <button onClick={() => addItem('pack')} className="flex-1 py-2.5 bg-white border border-gray-200 text-blue-600 text-[12px] font-semibold rounded-[14px] flex justify-center items-center gap-1.5 active:bg-gray-50 shadow-sm"><Icon name="box" size={16}/> Thêm Hộp</button>
                        <button onClick={() => addItem('single')} className="flex-1 py-2.5 bg-white border border-gray-200 text-orange-600 text-[12px] font-semibold rounded-[14px] flex justify-center items-center gap-1.5 active:bg-gray-50 shadow-sm"><Icon name="layers" size={16}/> Thêm Lẻ</button>
                    </div>

                    {/* List Items */}
                    <div className="space-y-2">
                        {items.map(item => <RowItem key={item.id} item={item} packSizes={packSizes} updateItem={updateItem} removeItem={removeItem} />)}
                    </div>

                    {/* Modal Lịch Sử */}
                    {showHistory && (
                        <div className="absolute inset-0 bg-gray-900/60 backdrop-blur-sm z-50 md:rounded-[32px] flex flex-col fade-in">
                            <div className="bg-white rounded-t-[24px] mt-auto max-h-[80%] flex flex-col shadow-2xl">
                                <div className="flex justify-between items-center p-4 border-b border-gray-100">
                                    <h3 className="font-bold">Lịch sử Tính Xuôi</h3>
                                    <button onClick={() => setShowHistory(false)} className="p-1 bg-gray-100 rounded-full"><Icon name="x" size={18}/></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {historyList.map(entry => (
                                        <div key={entry.id} className="bg-gray-50 p-3.5 rounded-2xl border border-gray-100">
                                            <div className="flex justify-between items-start mb-2">
                                                <div><p className="font-bold text-[14px]">{entry.name}</p><p className="text-[10px] text-gray-500">{entry.date}</p></div>
                                                <p className="font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded text-[13px]">{entry.total?.toLocaleString()}</p>
                                            </div>
                                            <div className="text-[11px] font-mono text-gray-500 break-all mb-3">{entry.formulaStr}</div>
                                            <div className="flex gap-2">
                                                <button onClick={() => { setItems(entry.data); setShowHistory(false); }} className="flex-1 bg-white border border-gray-200 py-1.5 rounded-lg text-[12px] font-semibold active:bg-gray-50">Tải lại</button>
                                                <button onClick={() => setHistoryList(historyList.filter(h=>h.id !== entry.id))} className="px-3 bg-red-50 text-red-500 rounded-lg"><Icon name="trash-2" size={16}/></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function Tab2Divider({ packSizes, showToast }) {
            const [targetTotal, setTargetTotal] = useState(() => {
                const s = localStorage.getItem('t2Target');
                return s ? parseInt(s) : 100;
            });
            
            const [allocations, setAllocations] = useState(() => {
                const saved = localStorage.getItem('t2Alloc');
                return saved ? JSON.parse(saved) : [{ id: Date.now()+'a', type: 'pack', packId: packSizes[0]?.id || '', qty: 0, multiplier: 1, isLocked: false }];
            });
            
            // Drag & Drop State
            const [draggedId, setDraggedId] = useState(null);
            const [dragOverId, setDragOverId] = useState(null);

            const [saveName, setSaveName] = useState('');
            const [showHistory, setShowHistory] = useState(false);
            const [historyList, setHistoryList] = useState(() => { const s = localStorage.getItem('t2Hist'); return s ? JSON.parse(s) : []; });
            
            // Auto save
            useEffect(() => { localStorage.setItem('t2Alloc', JSON.stringify(allocations)); }, [allocations]);
            useEffect(() => { localStorage.setItem('t2Target', targetTotal.toString()); }, [targetTotal]);
            useEffect(() => { localStorage.setItem('t2Hist', JSON.stringify(historyList)); }, [historyList]);

            const currentSum = allocations.reduce((sum, item) => {
                const mult = item.multiplier || 1;
                const qty = parseInt(item.qty) || 0;
                return sum + (item.type === 'pack' ? qty * mult * (packSizes.find(p => p.id === item.packId)?.size || 0) : qty * mult);
            }, 0);
            const unallocated = targetTotal - currentSum;

            const updateAlloc = (id, field, value) => setAllocations(allocations.map(a => a.id === id ? { ...a, [field]: value } : a));
            const removeAlloc = (id) => setAllocations(allocations.filter(a => a.id !== id));
            const addPack = () => setAllocations([...allocations, { id: Date.now() + Math.random(), type: 'pack', packId: packSizes[0]?.id, qty: 0, multiplier:1, isLocked: false }]);
            const addSingle = () => setAllocations([...allocations, { id: Date.now() + Math.random(), type: 'single', qty: 0, multiplier:1, isLocked: false }]);

            const resetForm = () => {
                setAllocations([{ id: Date.now()+'a', type: 'pack', packId: packSizes[0]?.id || '', qty: 0, multiplier: 1, isLocked: false }]);
                setTargetTotal(100);
                setSaveName('');
                showToast("Đã làm mới!");
            };

            // Xử lý Kéo thả Gộp
            const onDragStart = (e, id) => { setDraggedId(id); e.dataTransfer.effectAllowed = "move"; };
            const onDragOver = (e, targetItem) => {
                e.preventDefault(); e.dataTransfer.dropEffect = "move";
                if (targetItem.isLocked || targetItem.id === draggedId) { setDragOverId(null); return; }
                const draggedItem = allocations.find(a => a.id === draggedId);
                if (draggedItem && draggedItem.type === targetItem.type && draggedItem.packId === targetItem.packId) setDragOverId(targetItem.id);
                else setDragOverId(null);
            };
            const onDrop = (e, targetId) => {
                e.preventDefault(); setDragOverId(null);
                if (!draggedId || draggedId === targetId) return;
                const source = allocations.find(a => a.id === draggedId);
                const target = allocations.find(a => a.id === targetId);
                
                if (source && target && !target.isLocked && source.type === target.type && source.packId === target.packId) {
                    const sourceRealQty = (parseInt(source.qty)||0) * (source.multiplier||1);
                    const targetRealQty = (parseInt(target.qty)||0) * (target.multiplier||1);
                    
                    let newArr = allocations.map(a => a.id === targetId ? { ...a, qty: targetRealQty + sourceRealQty, multiplier: 1 } : a);
                    setAllocations(newArr.filter(a => a.id !== draggedId));
                    showToast("Đã gộp thành công!");
                }
                setDraggedId(null);
            };

            const autoFill = () => {
                if (unallocated <= 0 || packSizes.length === 0) return;
                const p0 = packSizes[0];
                const q = Math.floor(unallocated / p0.size);
                const s = unallocated % p0.size;
                let newArr = [...allocations];
                
                // Tái sử dụng dòng Hộp đang = 0 (nếu có), ngược lại mới tạo dòng mới
                if (q > 0) {
                    const emptyPackIdx = newArr.findIndex(a => a.type === 'pack' && a.packId === p0.id && (parseInt(a.qty) || 0) === 0 && !a.isLocked);
                    if (emptyPackIdx !== -1) {
                        newArr[emptyPackIdx] = { ...newArr[emptyPackIdx], qty: q };
                    } else {
                        newArr.push({ id: Date.now() + Math.random(), type: 'pack', packId: p0.id, qty: q, multiplier: 1, isLocked: false });
                    }
                }
                
                // Tái sử dụng dòng Lẻ đang = 0 (nếu có), ngược lại mới tạo dòng mới
                if (s > 0) {
                    const emptySingleIdx = newArr.findIndex(a => a.type === 'single' && (parseInt(a.qty) || 0) === 0 && !a.isLocked);
                    if (emptySingleIdx !== -1) {
                        newArr[emptySingleIdx] = { ...newArr[emptySingleIdx], qty: s };
                    } else {
                        newArr.push({ id: Date.now() + Math.random(), type: 'single', qty: s, multiplier: 1, isLocked: false });
                    }
                }
                
                setAllocations(newArr);
                showToast("Đã xếp tự động!");
            };

            const handleSave = () => {
                if (!saveName.trim()) { showToast("Nhập tên để lưu!"); return; }
                
                // Lọc bỏ 0 trước khi lưu
                const validAllocations = allocations.filter(a => (parseInt(a.qty)||0) > 0);
                
                const { formula } = generateFormulaString(validAllocations, packSizes);
                let finalStr = formula ? `${formula} = ${currentSum.toLocaleString()}` : '0';
                if(unallocated !== 0) finalStr += ` (Dư: ${unallocated})`;

                setHistoryList([{ id: Date.now(), name: saveName, date: new Date().toLocaleString('vi-VN'), data: validAllocations, targetTotal, formulaStr: finalStr }, ...historyList]);
                setSaveName(''); showToast("Đã lưu!");
            };

            const exportCSV = () => {
                let str = `TỔNG CẦN CHIA:,${targetTotal}\nLoại,Tên,Quy Cách,Hệ Số,Số Lượng,Tổng\n`;
                const validAllocations = allocations.filter(a => (parseInt(a.qty)||0) > 0);
                
                validAllocations.forEach(it => {
                    const isPack = it.type === 'pack';
                    const p = isPack ? packSizes.find(x => x.id === it.packId) : null;
                    const size = p ? p.size : 1;
                    const mult = it.multiplier || 1;
                    const rowTotal = it.qty * mult * size;
                    str += `${isPack ? 'Hộp' : 'Lẻ'},${p ? p.name : 'Lẻ'},${size},x${mult},${it.qty},${rowTotal}\n`;
                });
                str += `,,,,,ĐÃ CHIA:,${currentSum}\n,,,,,DƯ:,${unallocated}`;
                downloadCSV(str, `ChiaHang_${Date.now()}.csv`);
                showToast("Đã xuất Excel!");
            };

            return (
                <div className="p-3 space-y-3 fade-in relative">
                    
                    {/* Header Input Side-by-Side Tinh Gọn (Khắc phục lỗi phình to) */}
                    <div className="bg-white rounded-[20px] p-3 shadow-sm border border-gray-200">
                        <div className="flex items-center justify-between border-b border-gray-100 pb-2 mb-2">
                            <span className="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Tổng cần chia</span>
                            {/* CHUẨN NUMPAD IOS */}
                            <input 
                                type="text" inputMode="numeric" pattern="[0-9]*" 
                                value={targetTotal===0?'':targetTotal} 
                                onFocus={(e) => e.target.select()}
                                onChange={(e) => setTargetTotal(parseInt(e.target.value.replace(/[^0-9]/g, ''))||0)} 
                                className="w-32 text-right text-[32px] leading-none font-bold text-blue-600 outline-none bg-transparent placeholder-gray-200" 
                                placeholder="0" 
                            />
                        </div>
                        {/* Toolbar nhỏ gọn nằm trong thẻ */}
                        <div className="flex gap-1.5 h-9">
                            <input 
                                type="text" placeholder="Tên để lưu..." value={saveName} 
                                onFocus={(e) => e.target.select()} onChange={(e) => setSaveName(e.target.value)} 
                                className="flex-1 px-3 bg-gray-50 border border-gray-200 rounded-lg text-[13px] font-medium outline-none" 
                            />
                            <button onClick={handleSave} className="bg-blue-50 text-blue-600 w-10 flex justify-center items-center rounded-lg active:scale-95 border border-blue-100"><Icon name="save" size={16}/></button>
                            <button onClick={exportCSV} className="bg-gray-50 text-gray-600 w-10 flex justify-center items-center rounded-lg active:scale-95 border border-gray-200"><Icon name="file-spreadsheet" size={16}/></button>
                            <button onClick={() => setShowHistory(true)} className="bg-gray-50 text-gray-600 w-10 flex justify-center items-center rounded-lg active:scale-95 border border-gray-200"><Icon name="history" size={16}/></button>
                            <button onClick={resetForm} className="bg-red-50 text-red-500 w-10 flex justify-center items-center rounded-lg active:scale-95 border border-red-100"><Icon name="rotate-ccw" size={16}/></button>
                        </div>
                    </div>

                    {/* Status Alert Tinh Gọn */}
                    <div className={`p-3 rounded-[16px] flex items-center justify-between shadow-sm border transition-colors ${unallocated === 0 ? 'bg-emerald-50 border-emerald-200' : unallocated > 0 ? 'bg-orange-50 border-orange-300' : 'bg-red-50 border-red-200'}`}>
                        <div>
                            <p className={`text-[12px] font-bold uppercase tracking-wide ${unallocated === 0 ? 'text-emerald-700' : unallocated > 0 ? 'text-orange-700' : 'text-red-700'}`}>
                                {unallocated === 0 ? 'Đã phân bổ đủ' : unallocated > 0 ? 'Dư (Chưa xếp)' : 'Thiếu (Âm)'}
                            </p>
                            {unallocated > 0 && <p className="text-[10px] text-orange-600 mt-0.5 font-medium">Bấm Đũa thần để tự động xếp</p>}
                        </div>
                        <div className="flex items-center gap-3">
                            <span className={`text-[24px] font-bold leading-none ${unallocated === 0 ? 'text-emerald-600' : unallocated > 0 ? 'text-orange-600' : 'text-red-600'}`}>{Math.abs(unallocated)}</span>
                            {unallocated > 0 && <button onClick={autoFill} className="w-9 h-9 flex items-center justify-center bg-orange-500 text-white rounded-full shadow-md active:scale-95"><Icon name="wand-2" size={16}/></button>}
                        </div>
                    </div>

                    {/* Add Buttons */}
                    <div className="flex gap-2">
                        <button onClick={addPack} className="flex-1 py-2.5 bg-white border border-gray-200 text-blue-600 text-[12px] font-semibold rounded-[14px] flex justify-center items-center gap-1.5 active:bg-gray-50 shadow-sm"><Icon name="box" size={16}/> Thêm Hộp</button>
                        <button onClick={addSingle} className="flex-1 py-2.5 bg-white border border-gray-200 text-orange-600 text-[12px] font-semibold rounded-[14px] flex justify-center items-center gap-1.5 active:bg-gray-50 shadow-sm"><Icon name="layers" size={16}/> Thêm Lẻ</button>
                    </div>
                    
                    <p className="text-[10px] text-center text-gray-400 font-medium">💡 Chạm giữ nhãn <b className="bg-gray-200 px-1 rounded text-gray-600">x1</b> và kéo đè lên dòng khác để Gộp</p>

                    {/* List Items - Có hỗ trợ Drop */}
                    <div className="space-y-2">
                        {allocations.map(alloc => (
                            <div key={alloc.id} className={dragOverId === alloc.id ? 'drag-over rounded-[16px]' : ''}>
                                <RowItem 
                                    item={alloc} packSizes={packSizes} 
                                    updateItem={updateAlloc} removeItem={removeAlloc} 
                                    onDragStart={onDragStart} onDragOver={onDragOver} onDrop={onDrop}
                                />
                            </div>
                        ))}
                    </div>

                    {/* Modal Lịch Sử */}
                    {showHistory && (
                        <div className="absolute inset-0 bg-gray-900/60 backdrop-blur-sm z-50 md:rounded-[32px] flex flex-col fade-in">
                            <div className="bg-white rounded-t-[24px] mt-auto max-h-[80%] flex flex-col shadow-2xl">
                                <div className="flex justify-between items-center p-4 border-b border-gray-100">
                                    <h3 className="font-bold">Lịch sử Chia Ngược</h3>
                                    <button onClick={() => setShowHistory(false)} className="p-1 bg-gray-100 rounded-full"><Icon name="x" size={18}/></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {historyList.map(entry => (
                                        <div key={entry.id} className="bg-gray-50 p-3.5 rounded-2xl border border-gray-100">
                                            <div className="flex justify-between items-start mb-2">
                                                <div><p className="font-bold text-[14px]">{entry.name}</p><p className="text-[10px] text-gray-500">{entry.date}</p></div>
                                                <p className="font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded text-[13px]">{entry.targetTotal}</p>
                                            </div>
                                            <div className="text-[11px] font-mono text-gray-500 break-all mb-3">{entry.formulaStr}</div>
                                            <div className="flex gap-2">
                                                <button onClick={() => { setAllocations(entry.data); setTargetTotal(entry.targetTotal); setShowHistory(false); }} className="flex-1 bg-white border border-gray-200 py-1.5 rounded-lg text-[12px] font-semibold active:bg-gray-50">Tải lại</button>
                                                <button onClick={() => setHistoryList(historyList.filter(h=>h.id !== entry.id))} className="px-3 bg-red-50 text-red-500 rounded-lg"><Icon name="trash-2" size={16}/></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function Tab3Settings({ packSizes, setPackSizes, showToast, hasUpdate, setHasUpdate }) {
            const [newName, setNewName] = useState('');
            const [newSize, setNewSize] = useState('');

            const handleAdd = () => {
                if(newName && newSize) {
                    setPackSizes([...packSizes, { id: 'p'+Date.now(), name: newName, size: parseInt(newSize.replace(/[^0-9]/g, '')) }]);
                    setNewName(''); setNewSize('');
                    showToast("Đã thêm hộp mới");
                }
            };
            const remove = (id) => { if(packSizes.length>1) setPackSizes(packSizes.filter(p=>p.id!==id)); };

            return (
                <div className="p-3 space-y-4 fade-in">
                    
                    {hasUpdate ? (
                        <div className="bg-gray-900 p-4 rounded-[20px] shadow-lg text-white flex flex-col gap-2 relative overflow-hidden">
                            <div className="absolute -right-4 -top-4 opacity-10"><Icon name="rocket" size={80}/></div>
                            <div className="z-10">
                                <h3 className="font-bold text-base text-emerald-400">Bản cập nhật Siêu Phàm V6!</h3>
                                <p className="text-gray-300 text-[12px] mt-1">Lưu trữ thông minh (không sợ mất data khi thoát). Lọc sạch rác (xóa các hộp = 0). Nút Làm mới thần tốc.</p>
                            </div>
                            <button onClick={() => { setHasUpdate(false); showToast("Đã nâng cấp!"); }} className="z-10 mt-1 bg-emerald-500 text-white py-2 px-4 rounded-xl text-sm font-bold flex items-center justify-center gap-2 active:scale-95 shadow-md">
                                <Icon name="download" size={16} /> Áp dụng tính năng mới
                            </button>
                        </div>
                    ) : (
                        <div className="bg-emerald-50 text-emerald-700 p-3 rounded-2xl flex items-center gap-2 font-semibold border border-emerald-100 text-[12px]">
                            <Icon name="check-circle-2" size={18} /> Ứng dụng đã ở phiên bản xịn nhất.
                        </div>
                    )}

                    <div className="bg-white rounded-[20px] p-4 shadow-sm border border-gray-200">
                        <h3 className="font-bold text-gray-800 mb-3 text-[14px]">Quy Cách Đóng Gói</h3>
                        
                        <div className="space-y-2">
                            {packSizes.map(pack => (
                                <div key={pack.id} className="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                                    <div>
                                        <p className="font-semibold text-[13px] text-gray-900">{pack.name}</p>
                                        <span className="text-[10px] font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-md mt-0.5 inline-block">1 hộp = {pack.size} cái</span>
                                    </div>
                                    <button onClick={() => remove(pack.id)} disabled={packSizes.length<=1} className="p-2 bg-white rounded-lg shadow-sm border border-gray-200 text-gray-400 hover:text-red-500 disabled:opacity-50"><Icon name="trash-2" size={14}/></button>
                                </div>
                            ))}
                        </div>
                        
                        <div className="mt-4 pt-4 border-t border-gray-100">
                            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Thêm cấu hình mới</p>
                            <div className="flex gap-2">
                                <input 
                                    type="text" placeholder="Tên hộp..." value={newName} 
                                    onFocus={(e) => e.target.select()} onChange={e=>setNewName(e.target.value)} 
                                    className="flex-1 bg-gray-50 rounded-xl px-3 outline-none text-[13px] font-medium border border-gray-200 h-10" 
                                />
                                <input 
                                    type="text" inputMode="numeric" pattern="[0-9]*" placeholder="Số" 
                                    value={newSize} 
                                    onFocus={(e) => e.target.select()} onChange={e=>setNewSize(e.target.value.replace(/[^0-9]/g,''))} 
                                    className="w-[60px] bg-gray-50 rounded-xl text-center outline-none text-[13px] font-bold border border-gray-200 h-10" 
                                />
                                <button onClick={handleAdd} className="bg-gray-900 text-white w-10 rounded-xl flex items-center justify-center active:scale-95"><Icon name="plus" size={18}/></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
