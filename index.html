<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quản Lý Đóng Gói</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Import Font chữ hiện đại */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body { 
            margin: 0; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f2f2f7; /* Màu nền chuẩn iOS */
            -webkit-tap-highlight-color: transparent;
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Hiệu ứng mượt mà */
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .slide-up { animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Reset Input Number để trông đẹp trên Mobile */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* Cấu hình cho UI Kéo thả (Drag & Drop) */
        .drag-over { background-color: #e0e7ff !important; border-color: #6366f1 !important; transform: scale(1.01); transition: all 0.2s ease; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Helper component to render Lucide icons ---
        const Icon = ({ name, size = 24, className = '', color = 'currentColor' }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px; stroke:${color}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none;"></i>`;
                    iconRef.current.appendChild(tempDiv.firstChild);
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, size, color]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        // --- Hàm tạo chuỗi công thức ---
        const generateFormulaString = (items, packSizes) => {
            let parts = [];
            let total = 0;
            items.forEach(item => {
                const qty = parseInt(item.qty) || 0;
                const mult = parseInt(item.multiplier) || 1;
                const realQty = qty * mult;

                if (realQty > 0) {
                    if (item.type === 'pack') {
                        const pack = packSizes.find(p => p.id === item.packId);
                        if (pack) {
                            parts.push(`${realQty} x ${pack.size}`);
                            total += realQty * pack.size;
                        }
                    } else {
                        parts.push(`${realQty}`);
                        total += realQty;
                    }
                }
            });
            return { formula: parts.join(' + '), total };
        };

        // --- Main App Component ---
        function App() {
            const [activeTab, setActiveTab] = useState('tab1');
            const [packSizes, setPackSizes] = useState(() => {
                const saved = localStorage.getItem('packSizes');
                return saved ? JSON.parse(saved) : [
                    { id: 'p1', name: 'Thùng Lớn', size: 24 },
                    { id: 'p2', name: 'Hộp Vừa', size: 12 },
                    { id: 'p3', name: 'Lốc Nhỏ', size: 6 }
                ];
            });

            const [toastMsg, setToastMsg] = useState('');

            useEffect(() => { localStorage.setItem('packSizes', JSON.stringify(packSizes)); }, [packSizes]);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2500);
            };

            return (
                <div className="flex justify-center items-center min-h-screen bg-gray-300 md:p-4 font-sans text-gray-900">
                    <div className="w-full h-[100dvh] md:max-w-[420px] md:h-[850px] bg-[#f2f2f7] md:rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative md:border-[10px] border-gray-900">
                        
                        {/* Header tinh giản */}
                        <div className="bg-white/80 backdrop-blur-md pt-[env(safe-area-inset-top,40px)] md:pt-6 pb-3 px-6 z-20 flex justify-center items-end shrink-0 border-b border-gray-200/50">
                            <h1 className="text-lg font-black tracking-tight text-gray-800">
                                {activeTab === 'tab1' && 'Tính Xuôi (Kho)'}
                                {activeTab === 'tab2' && 'Chia Ngược (Đóng gói)'}
                                {activeTab === 'tab3' && 'Cài Đặt Hệ Thống'}
                            </h1>
                        </div>

                        {/* Toast Notification */}
                        {toastMsg && (
                            <div className="absolute top-[env(safe-area-inset-top,80px)] left-1/2 transform -translate-x-1/2 z-50 bg-gray-800/95 backdrop-blur text-white px-5 py-2.5 rounded-full shadow-lg text-[13px] font-bold fade-in flex items-center gap-2 whitespace-nowrap">
                                <Icon name="check-circle-2" size={16} color="#4ade80"/> {toastMsg}
                            </div>
                        )}

                        {/* Content Area */}
                        <div className="flex-1 overflow-y-auto pb-[90px] hide-scrollbar relative">
                            {activeTab === 'tab1' && <Tab1Calculator packSizes={packSizes} showToast={showToast} />}
                            {activeTab === 'tab2' && <Tab2Divider packSizes={packSizes} showToast={showToast} />}
                            {activeTab === 'tab3' && <Tab3Settings packSizes={packSizes} setPackSizes={setPackSizes} showToast={showToast} />}
                        </div>

                        {/* Bottom Navigation kiểu Apple Float */}
                        <div className="absolute bottom-0 w-full pb-[env(safe-area-inset-bottom,20px)] pt-2 px-4 z-30 pointer-events-none">
                            <div className="bg-white/90 backdrop-blur-lg border border-gray-200/50 shadow-[0_8px_30px_rgb(0,0,0,0.08)] rounded-full flex justify-around p-1.5 pointer-events-auto">
                                <NavButton icon="calculator" label="Tính Xuôi" isActive={activeTab === 'tab1'} onClick={() => setActiveTab('tab1')} />
                                <NavButton icon="package-open" label="Chia Ngược" isActive={activeTab === 'tab2'} onClick={() => setActiveTab('tab2')} />
                                <NavButton icon="settings" label="Cài Đặt" isActive={activeTab === 'tab3'} onClick={() => setActiveTab('tab3')} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- Component Nút Bottom Nav ---
        function NavButton({ icon, label, isActive, onClick }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-full py-2.5 px-1 relative transition-all duration-300 rounded-full ${isActive ? 'bg-gray-900 text-white shadow-md' : 'text-gray-400 hover:text-gray-600 active:bg-gray-100'}`}>
                    <Icon name={icon} size={20} className={`transition-transform duration-300 ${isActive ? 'scale-110' : ''}`} />
                    {isActive && <span className="text-[10px] mt-1 font-bold tracking-wide">{label}</span>}
                </button>
            );
        }

        // --- COMPONENT DÒNG ITEM ĐƯỢC THIẾT KẾ LẠI (V3.0) ---
        // Tích hợp Multiplier vào trong Drag Handle (hoặc nút bấm gọn gàng)
        function RowItem({ item, packSizes, updateItem, removeItem, onDragStart, onDragOver, onDrop }) {
            const isPack = item.type === 'pack';
            const mult = item.multiplier || 1;
            const packSize = isPack ? (packSizes.find(p => p.id === item.packId)?.size || 0) : 1;
            const itemTotal = (parseInt(item.qty) || 0) * mult * packSize;
            
            const [showMultModal, setShowMultModal] = useState(false);

            const handleQtyChange = (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                updateItem(item.id, 'qty', val === '' ? 0 : parseInt(val));
            };

            const applyResetToX1 = () => {
                const newQty = (parseInt(item.qty) || 0) * mult;
                updateItem(item.id, 'qty', newQty);
                updateItem(item.id, 'multiplier', 1);
                setShowMultModal(false);
            };

            return (
                <div 
                    draggable={!item.isLocked && !!onDragStart}
                    onDragStart={(e) => onDragStart && onDragStart(e, item.id)}
                    onDragOver={(e) => onDragOver && onDragOver(e, item)}
                    onDrop={(e) => onDrop && onDrop(e, item.id)}
                    className={`relative flex items-center p-2 rounded-[16px] border transition-all duration-200 ${item.isLocked ? 'bg-gray-50/80 border-gray-200' : 'bg-white border-gray-200 shadow-[0_2px_8px_rgba(0,0,0,0.02)]'}`}
                >
                    {/* Cụm Multiplier / Drag Handle (Tích hợp thông minh) */}
                    <div className="shrink-0 flex items-center mr-1">
                        {item.isLocked ? (
                            <button onClick={() => updateItem(item.id, 'isLocked', false)} className="w-10 h-10 flex flex-col items-center justify-center rounded-xl bg-red-50 text-red-500">
                                <Icon name="lock" size={14}/>
                            </button>
                        ) : (
                            <button 
                                onClick={() => setShowMultModal(!showMultModal)} 
                                className={`w-10 h-10 flex flex-col items-center justify-center rounded-xl border active:scale-95 transition-all cursor-grab active:cursor-grabbing ${mult > 1 ? 'bg-indigo-600 border-indigo-700 text-white shadow-sm' : 'bg-gray-100 border-gray-200 text-gray-500 hover:bg-gray-200'}`}
                            >
                                <Icon name="grip-horizontal" size={14} className="mb-0.5 opacity-60"/>
                                <span className="text-[10px] font-black leading-none">x{mult}</span>
                            </button>
                        )}
                    </div>

                    {/* Modal chọn Hệ Số dạng trượt đè lên (Không phá layout ngang) */}
                    {showMultModal && !item.isLocked && (
                        <div className="absolute z-10 left-12 top-1 bg-white border border-indigo-200 shadow-xl rounded-xl p-2 flex items-center gap-2 slide-up">
                            <span className="text-[11px] font-bold text-indigo-800 whitespace-nowrap">Hệ số:</span>
                            <div className="flex items-center bg-gray-50 border border-indigo-100 rounded-lg overflow-hidden h-7 w-16">
                                <span className="bg-indigo-100 text-indigo-700 text-[10px] font-black px-1.5 h-full flex items-center">x</span>
                                <input type="number" value={mult} onFocus={(e) => e.target.select()} onChange={e => updateItem(item.id, 'multiplier', parseInt(e.target.value)||1)} className="w-full text-center font-bold text-sm outline-none text-indigo-900 bg-transparent" />
                            </div>
                            {mult > 1 && (
                                <button onClick={applyResetToX1} className="text-[10px] font-bold bg-indigo-600 text-white px-2 py-1.5 rounded-lg active:scale-95 whitespace-nowrap shadow-sm">
                                    Gộp (Về x1)
                                </button>
                            )}
                            <button onClick={() => setShowMultModal(false)} className="p-1 bg-gray-100 text-gray-500 rounded-lg"><Icon name="x" size={14}/></button>
                        </div>
                    )}
                    
                    {/* Tên Hộp / Select */}
                    <div className="flex-1 min-w-0 mr-1 relative">
                        {isPack ? (
                            <select disabled={item.isLocked} value={item.packId} onChange={(e) => updateItem(item.id, 'packId', e.target.value)} className={`w-full bg-transparent text-[14px] font-bold outline-none truncate appearance-none pl-1 ${item.isLocked ? 'text-gray-500' : 'text-gray-800'}`}>
                                {packSizes.map(p => <option key={p.id} value={p.id}>{p.name} ({p.size})</option>)}
                            </select>
                        ) : (
                            <span className={`pl-1 w-full text-[14px] font-bold truncate block ${item.isLocked ? 'text-gray-500' : 'text-orange-600'}`}>Hàng Lẻ</span>
                        )}
                        {/* Fake mũi tên select cho đẹp */}
                        {isPack && !item.isLocked && <div className="absolute right-0 top-1/2 -translate-y-1/2 pointer-events-none opacity-30"><Icon name="chevron-down" size={14}/></div>}
                    </div>

                    {/* Bộ Stepper Vuông Khít */}
                    <div className={`flex items-center rounded-xl border ${item.isLocked ? 'border-transparent' : 'border-gray-200 bg-gray-50'} shrink-0 h-9 overflow-hidden`}>
                        <button disabled={item.isLocked} onClick={() => updateItem(item.id, 'qty', Math.max(0, (parseInt(item.qty)||0) - 1))} className="w-8 h-full flex items-center justify-center text-gray-500 active:bg-gray-200 border-r border-gray-200 font-bold">-</button>
                        <input disabled={item.isLocked} type="text" inputMode="numeric" pattern="[0-9]*" value={item.qty===0?'':item.qty} onFocus={(e) => e.target.select()} onChange={handleQtyChange} className={`w-10 h-full text-center text-[15px] font-black bg-transparent outline-none p-0 ${item.isLocked ? 'text-gray-500' : 'text-gray-900'}`} placeholder="0" />
                        <button disabled={item.isLocked} onClick={() => updateItem(item.id, 'qty', (parseInt(item.qty)||0) + 1)} className="w-8 h-full flex items-center justify-center text-gray-500 active:bg-gray-200 border-l border-gray-200 font-bold">+</button>
                    </div>

                    {/* Tổng & Xóa (Tinh gọn) */}
                    <div className="w-[45px] flex flex-col items-end justify-center shrink-0 ml-1">
                        <span className={`text-[13px] font-black leading-none mb-1 ${isPack ? 'text-blue-600' : 'text-orange-600'}`}>{itemTotal}</span>
                        <div className="flex gap-1">
                            {!item.isLocked && <button onClick={() => updateItem(item.id, 'isLocked', true)} className="text-gray-300 hover:text-gray-500 active:scale-90"><Icon name="lock" size={12}/></button>}
                            <button onClick={() => removeItem(item.id)} className="text-gray-300 hover:text-red-500 active:scale-90"><Icon name="trash-2" size={14}/></button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- Xuất CSV ---
        const downloadCSV = (dataStr, filename) => {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + dataStr;
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        // --- Tab 1: Tính Tổng (Xuôi) ---
        function Tab1Calculator({ packSizes, showToast }) {
            const [items, setItems] = useState([
                { id: Date.now(), type: 'pack', packId: packSizes[0]?.id || '', qty: 0, multiplier: 1, isLocked: false }
            ]);
            
            const [saveName, setSaveName] = useState('');
            const [showHistory, setShowHistory] = useState(false);
            const [historyList, setHistoryList] = useState(() => { const s = localStorage.getItem('t1Hist'); return s ? JSON.parse(s) : []; });
            useEffect(() => { localStorage.setItem('t1Hist', JSON.stringify(historyList)); }, [historyList]);

            const addItem = (type) => setItems([...items, { id: Date.now() + Math.random(), type, packId: type === 'pack' ? (packSizes[0]?.id || '') : null, qty: 0, multiplier: 1, isLocked: false }]);
            const updateItem = (id, field, value) => setItems(items.map(i => i.id === id ? { ...i, [field]: value } : i));
            const removeItem = (id) => setItems(items.filter(i => i.id !== id));

            const total = useMemo(() => items.reduce((acc, item) => {
                const mult = item.multiplier || 1;
                const qty = parseInt(item.qty) || 0;
                return acc + (item.type === 'pack' ? qty * mult * (packSizes.find(x => x.id === item.packId)?.size || 0) : qty * mult);
            }, 0), [items, packSizes]);

            const handleSave = () => {
                if (!saveName.trim()) { showToast("Nhập tên để lưu!"); return; }
                const { formula } = generateFormulaString(items, packSizes);
                const finalStr = formula ? `${formula} = ${total.toLocaleString()}` : '0';
                setHistoryList([{ id: Date.now(), name: saveName, date: new Date().toLocaleString('vi-VN'), data: items, total, formulaStr: finalStr }, ...historyList]);
                setSaveName(''); showToast("Đã lưu vào lịch sử");
            };

            const exportCSV = () => {
                let str = "Loại,Tên Hộp,Quy Cách,Lô(Hệ Số),Số Lượng Nhập,Thành Tiền\n";
                items.forEach(it => {
                    const isPack = it.type === 'pack';
                    const p = isPack ? packSizes.find(x => x.id === it.packId) : null;
                    const size = p ? p.size : 1;
                    const mult = it.multiplier || 1;
                    const rowTotal = it.qty * mult * size;
                    str += `${isPack ? 'Hộp' : 'Lẻ'},${p ? p.name : 'Hàng Lẻ'},${size},x${mult},${it.qty},${rowTotal}\n`;
                });
                str += `,,,,,TỔNG CỘNG:,${total}`;
                downloadCSV(str, `TinhTong_${new Date().getTime()}.csv`);
                showToast("Đã xuất Excel!");
            };

            const shareData = async () => {
                const { formula } = generateFormulaString(items, packSizes);
                const textShare = `Đơn: ${saveName || 'Tính Xuôi'}\nChi tiết: ${formula || '0'}\n=> TỔNG CỘNG: ${total.toLocaleString()}`;
                if (navigator.share) {
                    try { await navigator.share({ title: 'Tổng', text: textShare }); } catch(e){}
                } else showToast("Trình duyệt không hỗ trợ");
            };

            return (
                <div className="p-4 space-y-4 fade-in">
                    {/* Hero Card Sang trọng kiểu Thẻ Đen */}
                    <div className="bg-gray-900 rounded-[28px] p-6 shadow-xl relative overflow-hidden">
                        <div className="absolute -top-10 -right-10 opacity-10"><Icon name="calculator" size={150} color="white"/></div>
                        <p className="text-gray-400 text-[11px] font-black uppercase tracking-widest mb-1 z-10 relative">Tổng Thành Phẩm</p>
                        <h2 className="text-[48px] leading-none font-black text-white tracking-tighter z-10 relative mb-5">{total.toLocaleString()}</h2>
                        
                        {/* Toolbar Kính mờ nằm trong Card */}
                        <div className="bg-white/10 backdrop-blur-md rounded-2xl p-1.5 flex gap-1 z-10 relative border border-white/20">
                            <input type="text" placeholder="Tên để lưu..." value={saveName} onChange={(e) => setSaveName(e.target.value)} className="flex-1 px-3 bg-transparent text-white placeholder-gray-300 text-[13px] font-medium outline-none" />
                            <button onClick={handleSave} className="bg-blue-500 text-white p-2.5 rounded-xl active:scale-95"><Icon name="save" size={18}/></button>
                            <button onClick={shareData} className="bg-white/20 text-white p-2.5 rounded-xl active:scale-95"><Icon name="share-2" size={18}/></button>
                            <button onClick={exportCSV} className="bg-white/20 text-white p-2.5 rounded-xl active:scale-95"><Icon name="file-spreadsheet" size={18}/></button>
                            <button onClick={() => setShowHistory(true)} className="bg-white/20 text-white p-2.5 rounded-xl active:scale-95"><Icon name="history" size={18}/></button>
                        </div>
                    </div>

                    {/* Segmented Buttons gọn gàng */}
                    <div className="bg-white rounded-2xl p-1.5 flex gap-1.5 shadow-sm border border-gray-200">
                        <button onClick={() => addItem('pack')} className="flex-1 py-2.5 bg-blue-50 text-blue-700 text-[12px] font-black uppercase rounded-xl flex justify-center items-center gap-1.5 active:bg-blue-100 transition-colors"><Icon name="box" size={16}/> Thêm Hộp</button>
                        <button onClick={() => addItem('single')} className="flex-1 py-2.5 bg-orange-50 text-orange-600 text-[12px] font-black uppercase rounded-xl flex justify-center items-center gap-1.5 active:bg-orange-100 transition-colors"><Icon name="layers" size={16}/> Thêm Lẻ</button>
                    </div>

                    {/* Danh Sách Items */}
                    <div className="space-y-2 pb-10">
                        {items.map(item => <RowItem key={item.id} item={item} packSizes={packSizes} updateItem={updateItem} removeItem={removeItem} />)}
                    </div>

                    {/* Modal Lịch Sử */}
                    {showHistory && (
                        <div className="absolute inset-0 bg-gray-900/80 z-50 md:rounded-[32px] flex flex-col fade-in">
                            <div className="flex justify-between items-center p-4 bg-white pt-[env(safe-area-inset-top,16px)]">
                                <h3 className="font-bold">Lịch sử Tính Xuôi</h3>
                                <button onClick={() => setShowHistory(false)} className="p-2 bg-gray-100 rounded-full"><Icon name="x" size={18}/></button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                {historyList.map(entry => (
                                    <div key={entry.id} className="bg-white p-3.5 rounded-2xl shadow-sm">
                                        <div className="flex justify-between items-start mb-2">
                                            <div><p className="font-bold text-[15px]">{entry.name}</p><p className="text-[11px] text-gray-500">{entry.date}</p></div>
                                            <p className="font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-lg">Tổng: {entry.total?.toLocaleString()}</p>
                                        </div>
                                        <div className="bg-gray-50 p-2 rounded-lg border border-gray-100 text-[12px] font-mono text-gray-500 break-all mb-2">
                                            {entry.formulaStr}
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => { setItems(entry.data); setShowHistory(false); }} className="flex-1 bg-gray-100 py-2 rounded-xl text-[12px] font-bold active:bg-gray-200">Tải lại</button>
                                            <button onClick={() => setHistoryList(historyList.filter(h=>h.id !== entry.id))} className="px-4 bg-red-50 text-red-500 rounded-xl"><Icon name="trash-2" size={16}/></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Tab 2: Chia Thùng (Ngược) ---
        function Tab2Divider({ packSizes, showToast }) {
            const [targetTotal, setTargetTotal] = useState(100);
            
            // Khởi tạo List
            const [allocations, setAllocations] = useState([
                { id: Date.now()+'a', type: 'pack', packId: packSizes[0]?.id || '', qty: 0, multiplier: 1, isLocked: false }
            ]);
            
            // State cho Drag & Drop Gộp Hộp
            const [draggedId, setDraggedId] = useState(null);
            const [dragOverId, setDragOverId] = useState(null);

            const [saveName, setSaveName] = useState('');
            const [showHistory, setShowHistory] = useState(false);
            const [historyList, setHistoryList] = useState(() => { const s = localStorage.getItem('t2Hist'); return s ? JSON.parse(s) : []; });
            useEffect(() => { localStorage.setItem('t2Hist', JSON.stringify(historyList)); }, [historyList]);

            const currentSum = allocations.reduce((sum, item) => {
                const mult = item.multiplier || 1;
                const qty = parseInt(item.qty) || 0;
                return sum + (item.type === 'pack' ? qty * mult * (packSizes.find(p => p.id === item.packId)?.size || 0) : qty * mult);
            }, 0);
            const unallocated = targetTotal - currentSum;

            const updateAlloc = (id, field, value) => setAllocations(allocations.map(a => a.id === id ? { ...a, [field]: value } : a));
            const removeAlloc = (id) => setAllocations(allocations.filter(a => a.id !== id));
            const addPack = () => setAllocations([...allocations, { id: Date.now() + Math.random(), type: 'pack', packId: packSizes[0]?.id, qty: 1, multiplier:1, isLocked: false }]);
            const addSingle = () => setAllocations([...allocations, { id: Date.now() + Math.random(), type: 'single', qty: unallocated > 0 ? unallocated : 0, multiplier:1, isLocked: false }]);

            // --- Xử lý Drag & Drop Gộp Thông Minh ---
            const onDragStart = (e, id) => {
                setDraggedId(id);
                e.dataTransfer.effectAllowed = "move";
            };

            const onDragOver = (e, targetItem) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                if (targetItem.isLocked || targetItem.id === draggedId) { setDragOverId(null); return; }
                
                const draggedItem = allocations.find(a => a.id === draggedId);
                // Chỉ cho gộp nếu cùng loại
                if (draggedItem && draggedItem.type === targetItem.type && draggedItem.packId === targetItem.packId) {
                    setDragOverId(targetItem.id);
                } else {
                    setDragOverId(null);
                }
            };

            const onDrop = (e, targetId) => {
                e.preventDefault();
                setDragOverId(null);
                if (!draggedId || draggedId === targetId) return;
                
                const source = allocations.find(a => a.id === draggedId);
                const target = allocations.find(a => a.id === targetId);
                
                if (source && target && !target.isLocked && source.type === target.type && source.packId === target.packId) {
                    // Xử lý quy đổi hệ số (Đưa về x1 để cộng dồn)
                    const sourceRealQty = (parseInt(source.qty)||0) * (source.multiplier||1);
                    const targetRealQty = (parseInt(target.qty)||0) * (target.multiplier||1);
                    
                    let newArr = allocations.map(a => {
                        if (a.id === targetId) {
                            return { ...a, qty: targetRealQty + sourceRealQty, multiplier: 1 };
                        }
                        return a;
                    });
                    
                    // Xóa dòng bị kéo
                    setAllocations(newArr.filter(a => a.id !== draggedId));
                    showToast("Đã gộp thành công!");
                }
                setDraggedId(null);
            };

            // Gợi ý AI - Tự động nhét Dư
            const autoFill = () => {
                if (unallocated <= 0 || packSizes.length === 0) return;
                const p0 = packSizes[0];
                const q = Math.floor(unallocated / p0.size);
                const s = unallocated % p0.size;
                let newArr = [...allocations];
                // Cứ tạo riêng ra dòng mới như yêu cầu
                if (q > 0) newArr.push({ id: Date.now() + Math.random(), type: 'pack', packId: p0.id, qty: q, multiplier: 1, isLocked: false });
                if (s > 0) newArr.push({ id: Date.now() + Math.random(), type: 'single', qty: s, multiplier: 1, isLocked: false });
                setAllocations(newArr);
                showToast("Đã thêm dòng gợi ý mới!");
            };

            // Lưu & Xuất
            const handleSave = () => {
                if (!saveName.trim()) { showToast("Nhập tên để lưu!"); return; }
                const { formula } = generateFormulaString(allocations, packSizes);
                let finalStr = formula ? `${formula} = ${currentSum.toLocaleString()}` : '0';
                if(unallocated !== 0) finalStr += ` (Dư: ${unallocated})`;

                setHistoryList([{ id: Date.now(), name: saveName, date: new Date().toLocaleString('vi-VN'), data: allocations, targetTotal, formulaStr: finalStr }, ...historyList]);
                setSaveName(''); showToast("Đã lưu vào lịch sử");
            };

            const exportCSV = () => {
                let str = `TỔNG CẦN CHIA:,${targetTotal}\nLoại,Tên Hộp,Quy Cách,Lô(Hệ Số),Số Lượng,Thành Tiền\n`;
                allocations.forEach(it => {
                    const isPack = it.type === 'pack';
                    const p = isPack ? packSizes.find(x => x.id === it.packId) : null;
                    const size = p ? p.size : 1;
                    const mult = it.multiplier || 1;
                    const rowTotal = it.qty * mult * size;
                    str += `${isPack ? 'Hộp' : 'Lẻ'},${p ? p.name : 'Hàng Lẻ'},${size},x${mult},${it.qty},${rowTotal}\n`;
                });
                str += `,,,,,ĐÃ CHIA:,${currentSum}\n,,,,,DƯ:,${unallocated}`;
                downloadCSV(str, `ChiaHang_${new Date().getTime()}.csv`);
                showToast("Đã xuất Excel!");
            };

            return (
                <div className="p-4 space-y-4 fade-in relative">
                    
                    {/* Hero Input - Khối bo tròn lớn */}
                    <div className="bg-white rounded-[24px] p-5 shadow-[0_2px_15px_rgba(0,0,0,0.03)] border border-gray-100">
                        <label className="text-[11px] font-black text-gray-400 uppercase tracking-widest block mb-1">Tổng Cần Chia (D)</label>
                        <input 
                            type="text" inputMode="numeric" pattern="[0-9]*" 
                            value={targetTotal===0?'':targetTotal} 
                            onFocus={(e) => e.target.select()}
                            onChange={(e) => setTargetTotal(parseInt(e.target.value.replace(/[^0-9]/g, ''))||0)} 
                            className="w-full text-[48px] leading-none font-black text-blue-600 outline-none placeholder-gray-200 border-b border-gray-100 pb-2 mb-4" 
                            placeholder="0" 
                        />
                        
                        {/* Toolbar Tích hợp */}
                        <div className="flex gap-1.5">
                            <div className="flex-1 flex bg-gray-50 rounded-xl overflow-hidden border border-gray-200">
                                <input type="text" placeholder="Tên để lưu..." value={saveName} onChange={(e) => setSaveName(e.target.value)} className="flex-1 px-3 bg-transparent text-[13px] font-medium outline-none" />
                                <button onClick={handleSave} className="bg-blue-100 text-blue-700 px-3 active:scale-95 font-bold text-sm"><Icon name="save" size={16}/></button>
                            </div>
                            <button onClick={exportCSV} className="bg-gray-50 border border-gray-200 text-gray-600 p-2.5 rounded-xl active:scale-95"><Icon name="file-spreadsheet" size={18}/></button>
                            <button onClick={() => setShowHistory(true)} className="bg-gray-50 border border-gray-200 text-gray-600 p-2.5 rounded-xl active:scale-95"><Icon name="history" size={18}/></button>
                        </div>
                    </div>

                    {/* Status Alert - Siêu gọn */}
                    <div className={`p-4 rounded-2xl flex items-center justify-between shadow-sm border transition-colors ${unallocated === 0 ? 'bg-emerald-50 border-emerald-200' : unallocated > 0 ? 'bg-orange-50 border-orange-300' : 'bg-red-50 border-red-200'}`}>
                        <div>
                            <p className={`text-[12px] font-black uppercase tracking-wide ${unallocated === 0 ? 'text-emerald-700' : unallocated > 0 ? 'text-orange-700' : 'text-red-700'}`}>
                                {unallocated === 0 ? 'Đã phân bổ đủ' : unallocated > 0 ? 'Dư (Chưa xếp)' : 'Thiếu hàng (Âm)'}
                            </p>
                            {unallocated > 0 && <p className="text-[10px] text-orange-600 mt-1 font-bold">Bấm Đũa thần để nhét vào dòng mới</p>}
                        </div>
                        <div className="flex items-center gap-3">
                            <span className={`text-[28px] font-black leading-none ${unallocated === 0 ? 'text-emerald-600' : unallocated > 0 ? 'text-orange-600' : 'text-red-600'}`}>{Math.abs(unallocated)}</span>
                            {unallocated > 0 && <button onClick={autoFill} className="w-10 h-10 flex items-center justify-center bg-orange-500 text-white rounded-full shadow-md active:scale-95"><Icon name="wand-2" size={18}/></button>}
                        </div>
                    </div>

                    {/* Action Buttons Segmented */}
                    <div className="bg-white rounded-2xl p-1.5 flex gap-1.5 shadow-sm border border-gray-200">
                        <button onClick={addPack} className="flex-1 py-2.5 bg-blue-50 text-blue-700 text-[12px] font-black uppercase rounded-xl flex justify-center items-center gap-1.5 active:bg-blue-100 transition-colors"><Icon name="box" size={16}/> Thêm Hộp</button>
                        <button onClick={addSingle} className="flex-1 py-2.5 bg-orange-50 text-orange-600 text-[12px] font-black uppercase rounded-xl flex justify-center items-center gap-1.5 active:bg-orange-100 transition-colors"><Icon name="layers" size={16}/> Thêm Lẻ</button>
                    </div>

                    <p className="text-[11px] text-center text-gray-400 font-medium">💡 Chạm giữ nhãn <b className="bg-gray-200 text-gray-600 px-1 rounded">x1</b> kéo đè lên dòng khác để Gộp</p>

                    {/* List Items - Drag Zone */}
                    <div className="space-y-2 pb-10">
                        {allocations.map(alloc => (
                            <div key={alloc.id} className={dragOverId === alloc.id ? 'drag-over rounded-[16px]' : ''}>
                                <RowItem 
                                    item={alloc} 
                                    packSizes={packSizes} 
                                    updateItem={updateAlloc} 
                                    removeItem={removeAlloc} 
                                    onDragStart={onDragStart} 
                                    onDragOver={onDragOver} 
                                    onDrop={onDrop}
                                />
                            </div>
                        ))}
                    </div>

                    {/* Modal Lịch Sử */}
                    {showHistory && (
                        <div className="absolute inset-0 bg-gray-900/80 z-50 md:rounded-[32px] flex flex-col fade-in">
                            <div className="flex justify-between items-center p-4 bg-white pt-[env(safe-area-inset-top,16px)]">
                                <h3 className="font-bold">Lịch sử Chia Ngược</h3>
                                <button onClick={() => setShowHistory(false)} className="p-2 bg-gray-100 rounded-full"><Icon name="x" size={18}/></button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                {historyList.map(entry => (
                                    <div key={entry.id} className="bg-white p-3.5 rounded-2xl shadow-sm">
                                        <div className="flex justify-between items-start mb-2">
                                            <div><p className="font-bold text-[15px]">{entry.name}</p><p className="text-[11px] text-gray-500">{entry.date}</p></div>
                                            <p className="font-black text-orange-600 bg-orange-50 px-2 py-1 rounded-lg">Cần chia: {entry.targetTotal}</p>
                                        </div>
                                        <div className="bg-gray-50 p-2 rounded-lg border border-gray-100 text-[12px] font-mono text-gray-500 break-all mb-2">
                                            {entry.formulaStr}
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => { setAllocations(entry.data); setTargetTotal(entry.targetTotal); setShowHistory(false); }} className="flex-1 bg-gray-100 py-2 rounded-xl text-[12px] font-bold active:bg-gray-200">Tải lại</button>
                                            <button onClick={() => setHistoryList(historyList.filter(h=>h.id !== entry.id))} className="px-4 bg-red-50 text-red-500 rounded-xl"><Icon name="trash-2" size={16}/></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Tab 3: Cài Đặt ---
        function Tab3Settings({ packSizes, setPackSizes, showToast }) {
            const [newName, setNewName] = useState('');
            const [newSize, setNewSize] = useState('');

            const handleAdd = () => {
                if(newName && newSize) {
                    setPackSizes([...packSizes, { id: 'p'+Date.now(), name: newName, size: parseInt(newSize.replace(/[^0-9]/g, '')) }]);
                    setNewName(''); setNewSize('');
                    showToast("Đã thêm hộp mới");
                }
            };
            const remove = (id) => { if(packSizes.length>1) setPackSizes(packSizes.filter(p=>p.id!==id)); };

            return (
                <div className="p-4 space-y-6 fade-in">
                    <div className="bg-white rounded-[24px] p-5 shadow-sm border border-gray-200">
                        <h3 className="font-black text-gray-800 mb-4 text-[15px]">Quy Cách Đóng Gói</h3>
                        
                        <div className="space-y-2">
                            {packSizes.map(pack => (
                                <div key={pack.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-2xl border border-gray-100">
                                    <div>
                                        <p className="font-bold text-[14px] text-gray-900">{pack.name}</p>
                                        <span className="text-[11px] font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full mt-1 inline-block">1 hộp = {pack.size} cái</span>
                                    </div>
                                    <button onClick={() => remove(pack.id)} disabled={packSizes.length<=1} className="p-2.5 bg-white rounded-xl shadow-sm border border-gray-200 text-gray-400 hover:text-red-500 disabled:opacity-50"><Icon name="trash-2" size={16}/></button>
                                </div>
                            ))}
                        </div>
                        
                        <div className="mt-6 pt-5 border-t border-gray-100">
                            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">Thêm cấu hình mới</p>
                            <div className="flex gap-2">
                                <input type="text" placeholder="Tên hộp..." value={newName} onChange={e=>setNewName(e.target.value)} className="flex-1 bg-gray-50 rounded-xl px-3 outline-none text-[13px] font-bold border border-gray-200 focus:border-blue-400" />
                                <input type="text" inputMode="numeric" pattern="[0-9]*" placeholder="Số" value={newSize} onChange={e=>setNewSize(e.target.value.replace(/[^0-9]/g,''))} className="w-[60px] bg-gray-50 rounded-xl text-center outline-none text-[13px] font-black border border-gray-200 focus:border-blue-400" />
                                <button onClick={handleAdd} className="bg-gray-900 text-white w-12 rounded-xl flex items-center justify-center active:scale-95 shadow-md"><Icon name="plus" size={20}/></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
