<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kho Vận Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-app: #F2F2F7;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        body { 
            margin: 0; 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-app);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow: hidden; /* Cấm cuộn body, chỉ cuộn phần nội dung */
        }
        input, select { user-select: auto; outline: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .slide-up-modal { animation: slideUpModal 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUpModal { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Giải quyết triệt để lỗi đè Menu */
        .content-scroll-area {
            padding-bottom: calc(var(--safe-bottom) + 120px); 
        }

        /* Shadow chuẩn iOS */
        .shadow-ios { box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- CORE: Định dạng số VN ---
        const formatVN = (num) => {
            if (num === null || num === undefined || isNaN(num) || num === 0) return "";
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        };

        const parseVN = (str) => {
            if (!str) return 0;
            return parseInt(str.toString().replace(/\./g, '')) || 0;
        };

        const Icon = ({ name, size = 20, className = '', color = 'currentColor' }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px; stroke:${color}; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none;"></i>`;
                    iconRef.current.appendChild(tempDiv.firstChild);
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, size, color]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        // ==========================================
        // MAIN APP
        // ==========================================
        function App() {
            const [activeTab, setActiveTab] = useState('tab2');
            const [hasUpdate, setHasUpdate] = useState(true);
            const [packSizes, setPackSizes] = useState(() => {
                const saved = localStorage.getItem('packSizes_pro');
                return saved ? JSON.parse(saved) : [
                    { id: 'p1', name: 'K51 cốp', size: 2688 },
                    { id: 'p2', name: 'K56', size: 700 },
                    { id: 'p3', name: 'K53', size: 220 }
                ];
            });

            const [toastMsg, setToastMsg] = useState('');

            useEffect(() => { localStorage.setItem('packSizes_pro', JSON.stringify(packSizes)); }, [packSizes]);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2500);
            };

            return (
                <div className="flex justify-center h-[100dvh] bg-[#F2F2F7] md:p-4 overflow-hidden relative">
                    <div className="w-full h-full md:max-w-[428px] bg-[#F2F2F7] md:rounded-[40px] md:shadow-2xl overflow-hidden flex flex-col relative md:border-[8px] border-slate-800">
                        
                        {/* Header */}
                        <div className="bg-[#F2F2F7]/90 backdrop-blur-md pt-[env(safe-area-inset-top,20px)] md:pt-6 pb-2 px-6 z-20 flex justify-center items-center shrink-0 border-b border-slate-200/50">
                            <h1 className="text-[17px] font-black text-slate-900 tracking-tight">
                                {activeTab === 'tab1' && 'Tính Xuôi (Kho)'}
                                {activeTab === 'tab2' && 'Chia Ngược (Đóng gói)'}
                                {activeTab === 'tab3' && 'Cài Đặt Hệ Thống'}
                            </h1>
                        </div>

                        {/* Toast */}
                        {toastMsg && (
                            <div className="absolute top-[env(safe-area-inset-top,60px)] left-1/2 transform -translate-x-1/2 z-[100] bg-slate-800 text-white px-5 py-2.5 rounded-full shadow-2xl text-[13px] font-semibold fade-in flex items-center gap-2 whitespace-nowrap">
                                <Icon name="check-circle-2" size={16}/> {toastMsg}
                            </div>
                        )}

                        {/* Nội dung chính */}
                        <div className="flex-1 overflow-y-auto content-scroll-area hide-scrollbar px-3 pt-3">
                            {activeTab === 'tab1' && <Tab1Calculator packSizes={packSizes} showToast={showToast} />}
                            {activeTab === 'tab2' && <Tab2Divider packSizes={packSizes} showToast={showToast} />}
                            {activeTab === 'tab3' && <Tab3Settings packSizes={packSizes} setPackSizes={setPackSizes} hasUpdate={hasUpdate} setHasUpdate={setHasUpdate} />}
                        </div>

                        {/* Tab Bar - Thiết kế tròn tuyệt đối, lơ lửng */}
                        <div className="fixed md:absolute bottom-0 left-0 w-full z-40 pb-[calc(env(safe-area-inset-bottom,16px)+12px)] pointer-events-none flex justify-center">
                            <div className="bg-white/95 backdrop-blur-xl rounded-[32px] shadow-[0_8px_32px_rgba(0,0,0,0.08)] border border-slate-200/50 flex justify-between px-2 py-1.5 w-[calc(100%-32px)] md:w-[380px] pointer-events-auto">
                                <NavButton icon="calculator" label="Tính Xuôi" isActive={activeTab === 'tab1'} onClick={() => setActiveTab('tab1')} />
                                <NavButton icon="package-open" label="Chia Ngược" isActive={activeTab === 'tab2'} onClick={() => setActiveTab('tab2')} />
                                <NavButton icon="settings" label="Cài Đặt" isActive={activeTab === 'tab3'} onClick={() => setActiveTab('tab3')} hasBadge={hasUpdate} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function NavButton({ icon, label, isActive, onClick, hasBadge }) {
            return (
                <button onClick={onClick} className="flex flex-col items-center justify-center flex-1 h-[56px] relative group">
                    {/* Circle Background cho active state */}
                    <div className={`w-10 h-10 flex items-center justify-center rounded-full transition-colors duration-200 ${isActive ? 'bg-blue-50 text-blue-600' : 'text-slate-400 group-hover:text-slate-600'}`}>
                        <Icon name={icon} size={22} color="currentColor" />
                    </div>
                    <span className={`text-[10px] mt-0.5 tracking-wide transition-colors ${isActive ? 'font-bold text-blue-600' : 'font-medium text-slate-400'}`}>{label}</span>
                    {hasBadge && <div className="absolute top-1 right-6 w-2.5 h-2.5 bg-rose-500 border-2 border-white rounded-full"></div>}
                </button>
            );
        }

        // ==========================================
        // UI COMPONENTS
        // ==========================================
        const RowMultiplier = ({ multiplier, setMultiplier, packName }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [tempVal, setTempVal] = useState(multiplier);

            const apply = () => {
                const val = parseVN(tempVal) || 1;
                setMultiplier(val);
                setIsOpen(false);
            };

            return (
                <>
                    <button 
                        onClick={() => { setTempVal(formatVN(multiplier)); setIsOpen(true); }}
                        className="w-[38px] h-[38px] shrink-0 rounded-[12px] bg-slate-50 border border-slate-200 flex flex-col items-center justify-center active:bg-slate-100 transition-colors"
                    >
                        <Icon name="copy" size={13} className="mb-0.5 text-slate-400"/>
                        <span className="text-[10px] font-black leading-none text-slate-500">x{formatVN(multiplier)}</span>
                    </button>

                    {isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 fade-in px-4">
                            <div className="bg-white rounded-[32px] p-6 w-full max-w-[320px] shadow-2xl slide-up-modal flex flex-col gap-5">
                                <div className="text-center space-y-1">
                                    <h3 className="text-[18px] font-bold text-slate-800">Nhập Hệ Số (Lốc/Kiện)</h3>
                                    <p className="text-[13px] text-slate-500">Áp dụng: <b className="text-blue-600">{packName}</b></p>
                                </div>
                                <div className="flex bg-slate-100 rounded-[20px] p-2 items-center">
                                    <div className="w-12 text-center text-slate-400 font-black text-xl">x</div>
                                    <input 
                                        type="text" inputMode="numeric" pattern="[0-9]*" 
                                        value={tempVal} 
                                        onChange={(e) => setTempVal(formatVN(parseVN(e.target.value)))}
                                        onFocus={(e) => e.target.select()}
                                        className="flex-1 bg-white rounded-[16px] h-14 text-center font-black text-[26px] text-blue-600 shadow-sm"
                                    />
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setIsOpen(false)} className="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold text-[15px] rounded-[16px]">Hủy</button>
                                    <button onClick={apply} className="flex-1 py-3.5 bg-blue-600 text-white font-bold text-[15px] rounded-[16px] shadow-md active:bg-blue-700">Xác nhận</button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        const generateFormulaString = (items, packSizes) => {
            let parts = [];
            items.forEach(item => {
                const mult = Number(item.multiplier) || 1;
                const qtyNum = Number(item.qty) || 0;
                if (qtyNum > 0) {
                    if (item.type === 'pack') {
                        const pack = packSizes.find(p => p.id === item.packId);
                        if (pack) { parts.push(`${formatVN(qtyNum * mult)} x ${formatVN(pack.size)}`); }
                    } else {
                        parts.push(`${formatVN(qtyNum * mult)}`);
                    }
                }
            });
            return parts.join(' + ');
        };

        // ==========================================
        // TAB 1: TÍNH XUÔI
        // ==========================================
        function Tab1Calculator({ packSizes, showToast }) {
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('tab1Data_pro');
                return saved ? JSON.parse(saved) : [{ id: Date.now(), type: 'pack', packId: packSizes[0]?.id || '', qty: 0, multiplier: 1, isLocked: false }];
            });
            const [saveName, setSaveName] = useState('');
            const [showHistory, setShowHistory] = useState(false);
            const [historyList, setHistoryList] = useState(() => { 
                const saved = localStorage.getItem('tab1History_pro'); return saved ? JSON.parse(saved) : []; 
            });

            useEffect(() => { localStorage.setItem('tab1Data_pro', JSON.stringify(items)); }, [items]);
            useEffect(() => { localStorage.setItem('tab1History_pro', JSON.stringify(historyList)); }, [historyList]);

            const addItem = (type) => setItems([...items, { id: Date.now() + Math.random(), type, packId: type==='pack' ? packSizes[0]?.id : '', qty: 0, multiplier: 1, isLocked: false }]);
            const updateItem = (id, field, value) => setItems(items.map(i => i.id === id ? { ...i, [field]: value } : i));
            const removeItem = (id) => setItems(items.filter(i => i.id !== id));
            const clearAll = () => setItems([{ id: Date.now(), type: 'pack', packId: packSizes[0]?.id, qty: 0, multiplier: 1, isLocked: false }]);

            const total = useMemo(() => items.reduce((sum, item) => sum + (item.type === 'pack' ? (Number(item.qty) * (Number(item.multiplier)||1) * (packSizes.find(x => x.id === item.packId)?.size || 0)) : (Number(item.qty) * (Number(item.multiplier)||1))), 0), [items, packSizes]);

            const handleSave = () => {
                if (!saveName.trim()) { showToast("Nhập tên để lưu!"); return; }
                const formula = generateFormulaString(items, packSizes);
                const finalStr = formula ? `${formula} = ${formatVN(total)}` : '0';
                setHistoryList([{ id: Date.now(), name: saveName, date: new Date().toLocaleString('vi-VN'), data: items, total, formulaStr: finalStr }, ...historyList]);
                setSaveName(''); showToast("Đã lưu đơn");
            };

            const loadHistory = (entry) => { setItems(entry.data); setShowHistory(false); showToast(`Đã tải: ${entry.name}`); };
            const deleteHistory = (id) => setHistoryList(historyList.filter(h => h.id !== id));

            return (
                <div className="space-y-4 fade-in">
                    <div className="bg-slate-900 rounded-[28px] p-5 shadow-ios flex flex-col gap-4 relative overflow-hidden">
                        <div className="absolute -right-4 -top-4 opacity-[0.03] pointer-events-none"><Icon name="calculator" size={150} /></div>
                        <div className="flex justify-between items-start z-10">
                            <div className="flex flex-col">
                                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1">Tổng Thành Phẩm</span>
                                <span className="text-[42px] leading-none font-black text-white truncate max-w-[260px]">{total === 0 ? "0" : formatVN(total)}</span>
                            </div>
                            <button onClick={clearAll} className="w-10 h-10 bg-slate-800 text-slate-300 rounded-full flex items-center justify-center active:bg-slate-700 transition-colors"><Icon name="rotate-ccw" size={18}/></button>
                        </div>
                        
                        <div className="flex bg-slate-800 rounded-[16px] p-1 border border-slate-700 z-10 h-[52px]">
                            <input type="text" placeholder="Tên đơn hàng..." value={saveName} onChange={(e) => setSaveName(e.target.value)} className="flex-1 px-3 bg-transparent font-medium text-[14px] text-white placeholder-slate-400" />
                            <button onClick={handleSave} className="w-[48px] h-full bg-blue-600 text-white rounded-[12px] shadow-sm flex items-center justify-center active:scale-95 transition-transform"><Icon name="save" size={20}/></button>
                            <button onClick={() => setShowHistory(true)} className="w-[48px] h-full bg-slate-700 text-slate-300 rounded-[12px] shadow-sm ml-1.5 flex items-center justify-center active:scale-95 transition-transform"><Icon name="history" size={20}/></button>
                        </div>
                    </div>

                    <div className="flex gap-3">
                        <button onClick={() => addItem('pack')} className="flex-1 py-3.5 bg-white shadow-ios text-blue-600 text-[14px] font-bold rounded-[20px] flex items-center justify-center gap-2 active:bg-slate-50 border border-slate-100"><Icon name="box" size={18}/> Thêm Hộp</button>
                        <button onClick={() => addItem('single')} className="flex-1 py-3.5 bg-white shadow-ios text-orange-600 text-[14px] font-bold rounded-[20px] flex items-center justify-center gap-2 active:bg-slate-50 border border-slate-100"><Icon name="layers" size={18}/> Thêm Lẻ</button>
                    </div>

                    <div className="space-y-3">
                        {items.map(item => (
                            <RowItem key={item.id} item={item} packSizes={packSizes} updateItem={updateItem} removeItem={removeItem} />
                        ))}
                    </div>

                    {showHistory && <HistoryModal type="Tính Xuôi" historyList={historyList} close={() => setShowHistory(false)} loadHistory={loadHistory} deleteHistory={deleteHistory} />}
                </div>
            );
        }

        // ==========================================
        // TAB 2: CHIA NGƯỢC (ĐÓNG GÓI)
        // ==========================================
        function Tab2Divider({ packSizes, showToast }) {
            const [targetTotal, setTargetTotal] = useState(() => {
                const saved = localStorage.getItem('tab2Total_pro'); return saved ? parseInt(saved) : 0;
            });
            const [allocations, setAllocations] = useState(() => {
                const saved = localStorage.getItem('tab2Allocs_pro');
                return saved ? JSON.parse(saved) : [{ id: Date.now(), type: 'pack', packId: packSizes[0]?.id || '', qty: 0, multiplier: 1, isLocked: false }];
            });
            
            const [showInputHelper, setShowInputHelper] = useState(false);
            const [helperPacks, setHelperPacks] = useState([{ id: Date.now(), packId: packSizes[0]?.id, qty: 0 }]);
            const [helperSingles, setHelperSingles] = useState(0);

            const [showSuggestModal, setShowSuggestModal] = useState(false);
            const [manualPackSelect, setManualPackSelect] = useState(packSizes[0]?.id);

            const [saveName, setSaveName] = useState('');
            const [showHistory, setShowHistory] = useState(false);
            const [historyList, setHistoryList] = useState(() => {
                const saved = localStorage.getItem('tab2History_pro'); return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => { localStorage.setItem('tab2Total_pro', targetTotal); }, [targetTotal]);
            useEffect(() => { localStorage.setItem('tab2Allocs_pro', JSON.stringify(allocations)); }, [allocations]);
            useEffect(() => { localStorage.setItem('tab2History_pro', JSON.stringify(historyList)); }, [historyList]);

            useEffect(() => {
                if(!showInputHelper) return;
                let sum = parseInt(helperSingles) || 0;
                helperPacks.forEach(p => { sum += (parseInt(p.qty) || 0) * (packSizes.find(x => x.id === p.packId)?.size || 0); });
                setTargetTotal(sum);
            }, [helperPacks, helperSingles, packSizes, showInputHelper]);

            const currentSum = allocations.reduce((sum, a) => sum + (a.type === 'pack' ? Number(a.qty) * (Number(a.multiplier)||1) * (packSizes.find(p => p.id === a.packId)?.size || 1) : Number(a.qty) * (Number(a.multiplier)||1)), 0);
            const unallocated = targetTotal - currentSum;

            const updateAlloc = (id, field, value) => setAllocations(allocations.map(a => a.id === id ? { ...a, [field]: value } : a));
            const removeAlloc = (id) => setAllocations(allocations.filter(a => a.id !== id));
            
            const addPack = () => setAllocations([...allocations, { id: Date.now() + Math.random(), type: 'pack', packId: packSizes[0]?.id, qty: 0, multiplier: 1, isLocked: false }]);
            const addSingle = () => setAllocations([...allocations, { id: Date.now() + Math.random(), type: 'single', qty: 0, multiplier: 1, isLocked: false }]);
            
            const clearAll = () => {
                setTargetTotal(0);
                setAllocations([{ id: Date.now(), type: 'pack', packId: packSizes[0]?.id, qty: 0, multiplier: 1, isLocked: false }]);
                showToast("Đã dọn sạch");
            };

            const handleSave = () => {
                if (!saveName.trim()) { showToast("Nhập tên để lưu!"); return; }
                const formula = generateFormulaString(allocations, packSizes);
                let finalStr = formula ? `${formula} = ${formatVN(currentSum)}` : '0';
                if(unallocated !== 0) finalStr += ` (Dư: ${formatVN(unallocated)})`;

                setHistoryList([{ id: Date.now(), name: saveName, date: new Date().toLocaleString('vi-VN'), data: allocations, total: targetTotal, formulaStr: finalStr }, ...historyList]);
                setSaveName(''); showToast("Đã lưu đơn");
            };

            const loadHistory = (entry) => { setAllocations(entry.data); setTargetTotal(entry.total); setShowHistory(false); showToast(`Đã tải: ${entry.name}`); };
            const deleteHistory = (id) => setHistoryList(historyList.filter(h => h.id !== id));

            const handleSmartFillClick = () => {
                if (unallocated <= 0) return;
                const emptyRows = allocations.filter(a => a.type === 'pack' && Number(a.qty) === 0 && !a.isLocked);

                if (emptyRows.length > 0) {
                    let currentRem = unallocated;
                    let newAllocs = [...allocations];
                    
                    emptyRows.forEach(emptyRow => {
                        if (currentRem <= 0) return;
                        const idx = newAllocs.findIndex(a => a.id === emptyRow.id);
                        const packInfo = packSizes.find(p => p.id === emptyRow.packId);
                        if (packInfo && idx !== -1) {
                            const mult = Number(emptyRow.multiplier) || 1;
                            const capacity = packInfo.size * mult;
                            const fitQty = Math.floor(currentRem / capacity);
                            if (fitQty > 0) {
                                newAllocs[idx] = { ...newAllocs[idx], qty: fitQty };
                                currentRem -= (fitQty * capacity);
                            }
                        }
                    });

                    if (currentRem > 0) {
                         const singleIdx = newAllocs.findIndex(a => a.type === 'single' && !a.isLocked && (Number(a.multiplier)||1) === 1);
                         if (singleIdx !== -1) {
                             newAllocs[singleIdx] = { ...newAllocs[singleIdx], qty: Number(newAllocs[singleIdx].qty) + currentRem };
                         } else {
                             newAllocs.push({ id: Date.now() + Math.random(), type: 'single', qty: currentRem, multiplier: 1, isLocked: false });
                         }
                    }
                    setAllocations(newAllocs);
                    showToast("Đã tự động xếp!");
                } else {
                    setShowSuggestModal(true);
                }
            };

            const applyManualPack = () => {
                const pack = packSizes.find(p => p.id === manualPackSelect);
                if(!pack) return;
                const q = Math.floor(unallocated / pack.size);
                if(q > 0) {
                    setAllocations([...allocations, { id: Date.now() + Math.random(), type: 'pack', packId: pack.id, qty: q, multiplier: 1, isLocked: false }]);
                } else {
                    showToast("Dư quá ít, không đủ 1 hộp!");
                }
                setShowSuggestModal(false);
            };

            return (
                <div className="space-y-4 fade-in">
                    {/* KHỐI NHẬP TỔNG - Chuẩn Apple UI */}
                    <div className="bg-white rounded-[28px] p-4 shadow-ios border border-slate-100 flex flex-col gap-4">
                        <div className="flex justify-between items-center px-1">
                            <div className="flex flex-col flex-1 pr-2">
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Tổng Cần Chia</span>
                                    <button onClick={() => setShowInputHelper(!showInputHelper)} className="text-[10px] text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full flex items-center gap-1 font-bold active:bg-blue-100">
                                        <Icon name={showInputHelper ? "chevron-up" : "plus"} size={10}/> Kho
                                    </button>
                                </div>
                                <input 
                                    type="text" inputMode="numeric" pattern="[0-9]*" 
                                    value={targetTotal === 0 ? '' : formatVN(targetTotal)} 
                                    onChange={(e) => { setTargetTotal(parseVN(e.target.value)); setShowInputHelper(false); }} 
                                    onFocus={(e) => e.target.select()}
                                    placeholder="0"
                                    className="w-full text-left text-[44px] leading-none font-black text-blue-600 outline-none bg-transparent truncate py-1"
                                />
                            </div>
                            <button onClick={clearAll} className="w-10 h-10 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center shrink-0 active:bg-slate-200"><Icon name="rotate-ccw" size={18}/></button>
                        </div>
                        
                        {/* Tool nhập kho phụ trợ */}
                        {showInputHelper && (
                            <div className="bg-slate-50 rounded-[20px] p-3 space-y-2 border border-slate-100 fade-in">
                                {helperPacks.map(hp => (
                                    <div key={hp.id} className="flex gap-2">
                                        <select value={hp.packId} onChange={(e) => setHelperPacks(helperPacks.map(p => p.id === hp.id ? {...p, packId: e.target.value} : p))} className="flex-1 bg-white border border-slate-200 shadow-sm rounded-[14px] text-[14px] font-bold text-slate-700 px-3 outline-none h-12">
                                            {packSizes.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                        </select>
                                        <input 
                                            type="text" inputMode="numeric" pattern="[0-9]*" placeholder="SL" 
                                            value={hp.qty===0?'':formatVN(hp.qty)} 
                                            onChange={(e)=>setHelperPacks(helperPacks.map(p => p.id === hp.id ? {...p, qty: parseVN(e.target.value)} : p))} 
                                            onFocus={(e) => e.target.select()}
                                            className="w-20 bg-white border border-slate-200 shadow-sm rounded-[14px] text-center font-bold text-[15px] text-slate-800 outline-none h-12" 
                                        />
                                    </div>
                                ))}
                                <div className="flex gap-2 mt-2 items-center">
                                    <button onClick={() => setHelperPacks([...helperPacks, { id: Date.now(), packId: packSizes[0]?.id, qty: 0 }])} className="text-[12px] text-blue-600 bg-blue-50 py-2.5 px-3 rounded-[12px] font-bold active:bg-blue-100 flex items-center gap-1"><Icon name="plus" size={14}/> Hộp</button>
                                    <div className="flex-1 flex items-center gap-2 border-l border-slate-200 pl-3">
                                        <span className="text-[11px] text-slate-500 font-bold uppercase">Lẻ:</span>
                                        <input 
                                            type="text" inputMode="numeric" pattern="[0-9]*" placeholder="0"
                                            value={helperSingles===0?'':formatVN(helperSingles)} 
                                            onChange={(e)=>setHelperSingles(parseVN(e.target.value))} 
                                            onFocus={(e) => e.target.select()}
                                            className="flex-1 bg-white border border-slate-200 shadow-sm rounded-[12px] text-center font-bold text-[15px] h-10 outline-none text-slate-700" 
                                        />
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="flex bg-slate-50 border border-slate-200 rounded-[16px] p-1 h-[52px]">
                            <input type="text" placeholder="Tên đơn hàng..." value={saveName} onChange={(e) => setSaveName(e.target.value)} className="flex-1 px-3 bg-transparent font-medium text-[14px] text-slate-800" />
                            <button onClick={handleSave} className="w-12 h-full bg-blue-600 text-white rounded-[12px] shadow-sm flex items-center justify-center active:scale-95 transition-transform"><Icon name="save" size={18}/></button>
                            <button onClick={() => setShowHistory(true)} className="w-12 h-full bg-white text-slate-600 rounded-[12px] shadow-sm ml-1.5 border border-slate-200 flex items-center justify-center active:bg-slate-50 transition-colors"><Icon name="history" size={18}/></button>
                        </div>
                    </div>

                    {/* BANNER DƯ/ĐỦ MÀU SẮC LỚN - Phẳng Sạch */}
                    <div 
                        onClick={() => { if (unallocated > 0) handleSmartFillClick(); }}
                        className={`p-5 rounded-[24px] flex items-center justify-between shadow-ios transition-all ${unallocated === 0 ? 'bg-[#10B981]' : unallocated > 0 ? 'bg-[#F59E0B] cursor-pointer active:scale-[0.98]' : 'bg-[#EF4444]'}`}
                    >
                        <div className="flex flex-col text-white">
                            <span className="text-[12px] font-bold uppercase tracking-wider opacity-90">
                                {unallocated === 0 ? 'Hoàn Thành' : unallocated > 0 ? 'Dư (Chưa xếp)' : 'Lỗi Bị Âm'}
                            </span>
                            <span className="text-[34px] font-black leading-none mt-1">
                                {Math.abs(unallocated) === 0 ? "0" : formatVN(Math.abs(unallocated))}
                            </span>
                        </div>
                        {unallocated > 0 && <div className="w-12 h-12 bg-white/20 rounded-full flex justify-center items-center text-white"><Icon name="wand-2" size={24}/></div>}
                        {unallocated === 0 && <div className="w-12 h-12 bg-white/20 rounded-full flex justify-center items-center text-white"><Icon name="check" size={24}/></div>}
                    </div>

                    <div className="flex gap-3">
                        <button onClick={addPack} className="flex-1 py-3.5 bg-white shadow-ios text-blue-600 text-[14px] font-bold rounded-[20px] flex items-center justify-center gap-2 active:bg-slate-50 border border-slate-100"><Icon name="box" size={18}/> Hộp Mới</button>
                        <button onClick={addSingle} className="flex-1 py-3.5 bg-white shadow-ios text-orange-600 text-[14px] font-bold rounded-[20px] flex items-center justify-center gap-2 active:bg-slate-50 border border-slate-100"><Icon name="layers" size={18}/> Lẻ Mới</button>
                    </div>

                    <div className="text-center">
                        <p className="text-[11px] text-slate-400 font-medium inline-flex items-center gap-1.5 bg-white/50 px-3 py-1 rounded-full"><Icon name="lightbulb" size={12} className="text-amber-500"/> Chạm giữ nhãn <span className="font-bold bg-slate-200 px-1 rounded text-[10px]">x1</span> và kéo đè lên dòng khác để Gộp</p>
                    </div>

                    <div className="space-y-3">
                        {allocations.map((alloc) => (
                            <RowItem key={alloc.id} item={alloc} packSizes={packSizes} updateItem={updateAlloc} removeItem={removeAlloc} />
                        ))}
                    </div>

                    {showHistory && <HistoryModal type="Chia Ngược" historyList={historyList} close={() => setShowHistory(false)} loadHistory={loadHistory} deleteHistory={deleteHistory} />}

                    {/* MODAL GỢI Ý ĐŨA THẦN */}
                    {showSuggestModal && (
                        <div className="fixed inset-0 bg-slate-900/50 z-[100] flex items-end fade-in">
                            <div className="bg-white rounded-t-[40px] p-6 w-full shadow-2xl slide-up-modal pb-[calc(env(safe-area-inset-bottom,20px)+20px)]">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="font-bold text-slate-800 text-[18px] flex items-center gap-2">Chỉ định Hộp</h3>
                                    <button onClick={() => setShowSuggestModal(false)} className="w-8 h-8 bg-slate-100 text-slate-600 rounded-full flex justify-center items-center"><Icon name="x" size={18}/></button>
                                </div>
                                <div className="space-y-4">
                                    <div className="bg-amber-50 rounded-[20px] p-4 flex justify-between items-center border border-amber-100">
                                        <span className="text-amber-800 font-semibold text-[14px]">Cần xếp:</span>
                                        <span className="text-[22px] font-black text-amber-600">{formatVN(unallocated)}</span>
                                    </div>
                                    <select value={manualPackSelect} onChange={(e) => setManualPackSelect(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-[20px] px-4 font-bold text-[16px] text-blue-700 h-14 shadow-sm outline-none">
                                        {packSizes.map(p => <option key={p.id} value={p.id}>{p.name} ({formatVN(p.size)})</option>)}
                                    </select>
                                    <button onClick={applyManualPack} className="w-full h-14 bg-blue-600 text-white font-bold text-[16px] rounded-[20px] active:bg-blue-700 shadow-md mt-2">
                                        Điền vào hộp này
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // ROW ITEM: THIẾT KẾ CỰC KỲ NHỎ GỌN (COMPACT V2)
        // ==========================================
        function RowItem({ item, packSizes, updateItem, removeItem }) {
            const isPack = item.type === 'pack';
            const mult = Number(item.multiplier) || 1;
            const qtyNum = Number(item.qty) || 0;
            const itemTotal = isPack ? (qtyNum * mult * (packSizes.find(p => p.id === item.packId)?.size || 0)) : (qtyNum * mult);
            const isWaiting = qtyNum === 0;
            
            const packInfo = packSizes.find(p => p.id === item.packId);
            const packName = isPack ? (packInfo?.name || 'Hộp') : 'Hàng Lẻ';

            return (
                <div className={`bg-white rounded-[24px] p-3 shadow-sm border transition-colors flex flex-col gap-2.5 ${item.isLocked ? 'opacity-60 bg-slate-50 border-slate-200' : (isWaiting ? 'border-amber-300 shadow-amber-100/50' : 'border-slate-100')}`}>
                    
                    {/* Tầng 1: Tên & Tổng */}
                    <div className="flex justify-between items-center gap-2 pl-1">
                        <div className="flex items-center gap-3 flex-1 min-w-0">
                            <RowMultiplier multiplier={mult} setMultiplier={(v) => updateItem(item.id, 'multiplier', v)} packName={packName} />
                            <div className="flex-1 truncate">
                                {isPack ? (
                                    <select disabled={item.isLocked} value={item.packId} onChange={(e) => updateItem(item.id, 'packId', e.target.value)} className={`w-full bg-transparent text-[16px] font-bold outline-none appearance-none ${item.isLocked ? 'text-slate-500' : 'text-slate-800'}`}>
                                        {packSizes.map(p => <option key={p.id} value={p.id}>{p.name} ({formatVN(p.size)})</option>)}
                                    </select>
                                ) : (
                                    <span className="text-[16px] font-bold text-orange-600">Hàng Lẻ</span>
                                )}
                            </div>
                        </div>
                        <div className={`text-[18px] font-black shrink-0 pr-1 ${isPack ? 'text-blue-600' : 'text-orange-600'}`}>
                            {itemTotal === 0 ? "0" : formatVN(itemTotal)}
                        </div>
                    </div>
                    
                    {/* Tầng 2: Stepper (Liền khối) & Action */}
                    <div className="flex justify-between items-center pl-[52px]">
                        {/* Stepper phong cách mới liền mạch màu xám nhạt */}
                        <div className={`flex items-center bg-slate-100 rounded-[12px] h-[36px] w-[130px] overflow-hidden ${item.isLocked ? 'pointer-events-none opacity-60' : ''}`}>
                            <button onClick={() => updateItem(item.id, 'qty', Math.max(0, qtyNum - 1))} className="w-10 h-full flex items-center justify-center text-slate-600 active:bg-slate-200 font-black text-xl">-</button>
                            <input 
                                type="text" inputMode="numeric" pattern="[0-9]*" 
                                value={item.qty===0?'':formatVN(item.qty)} 
                                onChange={(e) => updateItem(item.id, 'qty', parseVN(e.target.value))}
                                onFocus={(e) => e.target.select()}
                                placeholder="0"
                                className="flex-1 w-full h-full text-center text-[16px] font-black bg-white outline-none p-0" 
                            />
                            <button onClick={() => updateItem(item.id, 'qty', qtyNum + 1)} className="w-10 h-full flex items-center justify-center text-slate-600 active:bg-slate-200 font-black text-xl">+</button>
                        </div>
                        
                        <div className="flex gap-2 pr-1">
                            <button onClick={() => updateItem(item.id, 'isLocked', !item.isLocked)} className={`w-9 h-9 rounded-[10px] flex items-center justify-center transition-colors ${item.isLocked ? 'bg-amber-100 text-amber-600' : 'text-slate-300 hover:text-slate-500 hover:bg-slate-100 active:bg-slate-200'}`}><Icon name={item.isLocked ? 'lock' : 'unlock'} size={15} /></button>
                            <button onClick={() => removeItem(item.id)} className="w-9 h-9 rounded-[10px] flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 active:bg-rose-100 transition-colors"><Icon name="trash-2" size={15}/></button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // COMPONENT LỊCH SỬ (FULL SCREEN MODAL)
        // ==========================================
        const HistoryModal = ({ type, historyList, close, loadHistory, deleteHistory }) => (
            <div className="fixed inset-0 bg-slate-900/50 z-[100] flex flex-col fade-in">
                <div className="bg-[#F2F2F7] pt-[env(safe-area-inset-top,20px)] pb-3 px-5 flex justify-between items-center border-b border-slate-200 shadow-sm z-10">
                    <h3 className="font-bold text-slate-800 text-[18px]">Lịch sử {type}</h3>
                    <button onClick={close} className="w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-sm"><Icon name="x" size={18}/></button>
                </div>
                <div className="flex-1 overflow-y-auto p-4 bg-[#F2F2F7] space-y-4 pb-[calc(env(safe-area-inset-bottom,20px)+40px)]">
                    {historyList.length === 0 ? <p className="text-center text-slate-500 mt-10 font-medium text-[14px]">Trống.</p> : historyList.map(entry => (
                        <div key={entry.id} className="bg-white p-5 rounded-[24px] shadow-sm flex flex-col gap-3">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="font-bold text-slate-800 text-[16px]">{entry.name}</p>
                                    <p className="text-[11px] text-slate-400 font-medium mt-1">{entry.date}</p>
                                </div>
                                <span className="text-[14px] font-black text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full">{formatVN(entry.total)}</span>
                            </div>
                            <div className="bg-slate-50 p-3 rounded-[16px] text-[13px] font-mono font-medium text-slate-600 leading-relaxed border border-slate-100">
                                {entry.formulaStr}
                            </div>
                            <div className="flex gap-2 pt-2">
                                <button onClick={() => loadHistory(entry)} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold text-[14px] rounded-[16px] active:bg-slate-200 flex items-center justify-center gap-1.5"><Icon name="download" size={16}/> Mở lại đơn</button>
                                <button onClick={() => deleteHistory(entry.id)} className="w-[52px] bg-rose-50 text-rose-500 rounded-[16px] active:bg-rose-100 flex items-center justify-center"><Icon name="trash-2" size={18}/></button>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        // ==========================================
        // TAB 3: CÀI ĐẶT (SETTINGS)
        // ==========================================
        function Tab3Settings({ packSizes, setPackSizes, hasUpdate, setHasUpdate }) {
            const [newName, setNewName] = useState('');
            const [newSize, setNewSize] = useState('');
            
            const handleAdd = () => {
                if (newName && newSize) {
                    setPackSizes([...packSizes, { id: 'p' + Date.now(), name: newName, size: parseVN(newSize) }]);
                    setNewName(''); setNewSize('');
                }
            };
            return (
                <div className="space-y-4 fade-in">
                    {/* Báo Cập Nhật (Style Dark Mode như ảnh 10:06) */}
                    {hasUpdate && (
                        <div className="bg-slate-900 p-5 rounded-[24px] shadow-lg text-white flex flex-col gap-2 relative overflow-hidden">
                            <div className="absolute -right-4 -bottom-4 opacity-10"><Icon name="rocket" size={100}/></div>
                            <h3 className="font-bold text-[16px] text-emerald-400 flex items-center gap-1.5 z-10">Bản cập nhật Siêu Phẩm Pro v1.0!</h3>
                            <p className="text-slate-300 text-[12px] leading-relaxed font-medium z-10">Lưu trữ thông minh (không sợ mất data). Fix triệt để lỗi đè UI. Giao diện chuẩn Native iOS.</p>
                            <button onClick={() => setHasUpdate(false)} className="mt-2 text-[13px] font-bold bg-emerald-500 text-white py-2.5 rounded-[12px] w-full active:bg-emerald-600 z-10 flex justify-center items-center gap-1.5"><Icon name="download" size={16}/> Áp dụng tính năng mới</button>
                        </div>
                    )}

                    <div className="bg-white rounded-[32px] shadow-ios p-5 border border-slate-100">
                        <h3 className="font-bold text-slate-800 text-[14px] mb-4">Quy Cách Đóng Gói</h3>
                        <div className="space-y-3">
                            {packSizes.map(pack => (
                                <div key={pack.id} className="flex justify-between items-center bg-white p-3.5 rounded-[20px] border border-slate-100 shadow-sm">
                                    <div>
                                        <p className="font-bold text-slate-800 text-[16px]">{pack.name}</p>
                                        <span className="inline-block bg-blue-50 text-blue-600 text-[11px] font-bold px-2 py-0.5 rounded-md mt-1.5">1 hộp = {formatVN(pack.size)}</span>
                                    </div>
                                    <button onClick={() => setPackSizes(packSizes.filter(p => p.id !== pack.id))} className="w-10 h-10 bg-slate-50 text-slate-400 rounded-[12px] flex items-center justify-center active:bg-slate-100 border border-slate-100" disabled={packSizes.length <= 1}><Icon name="trash-2" size={16} /></button>
                                </div>
                            ))}
                        </div>
                        
                        <div className="mt-6 pt-5 border-t border-slate-100">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2 px-1">Thêm cấu hình mới</span>
                            <div className="flex gap-2 w-full">
                                <input type="text" placeholder="Tên Hộp" value={newName} onChange={e => setNewName(e.target.value)} className="flex-[3] bg-white border border-slate-200 shadow-sm rounded-[16px] px-3 h-[52px] text-[14px] outline-none font-semibold text-slate-800 focus:border-blue-500 min-w-0" />
                                <input type="text" inputMode="numeric" pattern="[0-9]*" placeholder="S.Lượng" value={newSize===0?'':formatVN(newSize)} onChange={e => setNewSize(parseVN(e.target.value))} className="flex-[2] bg-white border border-slate-200 shadow-sm rounded-[16px] h-[52px] text-[14px] outline-none text-center font-black text-slate-800 focus:border-blue-500 min-w-0" />
                                <button onClick={handleAdd} className="w-[56px] h-[52px] bg-slate-900 text-white rounded-[16px] active:scale-95 flex items-center justify-center shrink-0"><Icon name="plus" size={20}/></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
