<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quản Lý Đóng Gói</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 20px);
        }
        body { 
            margin: 0; 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: #F2F2F7; /* Chuẩn màu nền iOS */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        input, select { user-select: auto; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .slide-up-modal { animation: slideUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUpModal { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        input { border-radius: 0; -webkit-appearance: none; appearance: none; }
        
        /* Padding bù cho thanh tab bar ở dưới */
        .content-area { padding-bottom: calc(var(--safe-bottom) + 100px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- HÀM FORMAT SỐ (12.000) ---
        const formatVN = (num) => {
            if (num === null || num === undefined || isNaN(num) || num === 0) return "";
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        };

        const parseVN = (str) => {
            if (!str) return 0;
            return parseInt(str.toString().replace(/\./g, '')) || 0;
        };

        const Icon = ({ name, size = 20, className = '', color = 'currentColor' }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px; stroke:${color}; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none;"></i>`;
                    iconRef.current.appendChild(tempDiv.firstChild);
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, size, color]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        function App() {
            const [activeTab, setActiveTab] = useState('tab2');
            const [packSizes, setPackSizes] = useState(() => {
                const saved = localStorage.getItem('packSizes');
                return saved ? JSON.parse(saved) : [
                    { id: 'p1', name: 'K51 cốp', size: 2688 },
                    { id: 'p2', name: 'K56', size: 700 }
                ];
            });

            const [toastMsg, setToastMsg] = useState('');

            useEffect(() => { localStorage.setItem('packSizes', JSON.stringify(packSizes)); }, [packSizes]);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2500);
            };

            return (
                <div className="flex justify-center h-screen bg-[#F2F2F7] md:p-4 overflow-hidden relative">
                    <div className="w-full h-full md:max-w-[428px] bg-[#F2F2F7] md:rounded-[40px] md:shadow-2xl overflow-hidden flex flex-col relative md:border-[8px] border-slate-800">
                        
                        {/* Header iOS Style */}
                        <div className="bg-[#F2F2F7]/90 backdrop-blur-md pt-[env(safe-area-inset-top,20px)] md:pt-6 pb-2 px-6 z-20 flex justify-center items-center shrink-0 border-b border-gray-200">
                            <h1 className="text-[18px] font-bold text-slate-900 tracking-tight">
                                {activeTab === 'tab1' && 'Tính Xuôi (Kho)'}
                                {activeTab === 'tab2' && 'Chia Ngược (Đóng gói)'}
                                {activeTab === 'tab3' && 'Cài Đặt Hệ Thống'}
                            </h1>
                        </div>

                        {/* Toast */}
                        {toastMsg && (
                            <div className="absolute top-[env(safe-area-inset-top,60px)] left-1/2 transform -translate-x-1/2 z-[100] bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-semibold fade-in flex items-center gap-2 whitespace-nowrap">
                                <Icon name="check-circle-2" size={18}/> {toastMsg}
                            </div>
                        )}

                        {/* Nội dung chính cuộn */}
                        <div className="flex-1 overflow-y-auto content-area hide-scrollbar">
                            {activeTab === 'tab1' && <Tab1Calculator packSizes={packSizes} showToast={showToast} />}
                            {activeTab === 'tab2' && <Tab2Divider packSizes={packSizes} showToast={showToast} />}
                            {activeTab === 'tab3' && <Tab3Settings packSizes={packSizes} setPackSizes={setPackSizes} />}
                        </div>

                        {/* Thanh Tab Bar chuẩn Apple */}
                        <div className="absolute bottom-0 w-full z-30 pb-[env(safe-area-inset-bottom,0px)] bg-white/80 backdrop-blur-xl border-t border-gray-200">
                            <div className="flex justify-around items-center pt-2 pb-1">
                                <NavButton icon="calculator" label="Tính Xuôi" isActive={activeTab === 'tab1'} onClick={() => setActiveTab('tab1')} />
                                <NavButton icon="package-open" label="Chia Ngược" isActive={activeTab === 'tab2'} onClick={() => setActiveTab('tab2')} />
                                <NavButton icon="settings" label="Cài Đặt" isActive={activeTab === 'tab3'} onClick={() => setActiveTab('tab3')} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function NavButton({ icon, label, isActive, onClick }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-24 h-12 transition-colors ${isActive ? 'text-blue-600' : 'text-slate-400'}`}>
                    <Icon name={icon} size={24} className={isActive ? "fill-blue-100" : ""} color="currentColor" />
                    <span className={`text-[10px] mt-1 tracking-wide ${isActive ? 'font-bold' : 'font-medium'}`}>{label}</span>
                </button>
            );
        }

        // --- COMPONENT NHẬP HỆ SỐ (POPUP PRO - Không đè UI) ---
        const RowMultiplier = ({ multiplier, setMultiplier, packName }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [tempVal, setTempVal] = useState(multiplier);

            const apply = () => {
                const val = parseVN(tempVal) || 1;
                setMultiplier(val);
                setIsOpen(false);
            };

            return (
                <>
                    <button 
                        onClick={() => { setTempVal(formatVN(multiplier)); setIsOpen(true); }}
                        className={`w-[42px] h-[42px] shrink-0 rounded-2xl flex flex-col items-center justify-center transition-colors shadow-sm ${multiplier > 1 ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-500 border border-slate-200'}`}
                    >
                        <Icon name="copy" size={14} className={multiplier > 1 ? "opacity-80 mb-0.5" : "mb-0.5"}/>
                        <span className="text-[10px] font-bold leading-none">x{formatVN(multiplier)}</span>
                    </button>

                    {isOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/40 fade-in">
                            <div className="bg-white rounded-[28px] p-6 w-[320px] shadow-2xl slide-up-modal flex flex-col gap-4">
                                <div className="text-center">
                                    <h3 className="text-lg font-bold text-slate-800">Nhập Hệ Số (Lốc/Kiện)</h3>
                                    <p className="text-xs text-slate-500 mt-1">Áp dụng cho: <b className="text-blue-600">{packName}</b></p>
                                </div>
                                
                                <div className="flex bg-slate-100 rounded-[20px] p-2 items-center">
                                    <div className="w-12 text-center text-slate-400 font-black text-xl">x</div>
                                    <input 
                                        type="text" inputMode="numeric" pattern="[0-9]*" 
                                        value={tempVal} 
                                        onChange={(e) => setTempVal(formatVN(parseVN(e.target.value)))}
                                        onFocus={(e) => e.target.select()}
                                        className="flex-1 bg-white rounded-[16px] h-14 text-center font-black text-2xl text-indigo-600 outline-none shadow-sm"
                                    />
                                </div>

                                <div className="flex gap-2 mt-2">
                                    <button onClick={() => setIsOpen(false)} className="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-[16px]">Hủy</button>
                                    <button onClick={apply} className="flex-1 py-3.5 bg-indigo-600 text-white font-bold rounded-[16px] shadow-md active:bg-indigo-700">Xác nhận</button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        const generateFormulaString = (items, packSizes) => {
            let parts = [];
            items.forEach(item => {
                const mult = Number(item.multiplier) || 1;
                const qtyNum = Number(item.qty) || 0;
                if (qtyNum > 0) {
                    if (item.type === 'pack') {
                        const pack = packSizes.find(p => p.id === item.packId);
                        if (pack) { parts.push(`${formatVN(qtyNum * mult)} x ${formatVN(pack.size)}`); }
                    } else {
                        parts.push(`${formatVN(qtyNum * mult)}`);
                    }
                }
            });
            return parts.join(' + ');
        };

        // --- TAB 1: TÍNH XUÔI ---
        function Tab1Calculator({ packSizes, showToast }) {
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('tab1Data');
                return saved ? JSON.parse(saved) : [{ id: Date.now(), type: 'pack', packId: packSizes[0]?.id || '', qty: 0, multiplier: 1, isLocked: false }];
            });
            
            const [saveName, setSaveName] = useState('');
            const [showHistory, setShowHistory] = useState(false);
            const [historyList, setHistoryList] = useState(() => { 
                const saved = localStorage.getItem('tab1History'); return saved ? JSON.parse(saved) : []; 
            });

            useEffect(() => { localStorage.setItem('tab1Data', JSON.stringify(items)); }, [items]);
            useEffect(() => { localStorage.setItem('tab1History', JSON.stringify(historyList)); }, [historyList]);

            const addItem = (type) => setItems([...items, { id: Date.now() + Math.random(), type, packId: type==='pack' ? packSizes[0]?.id : '', qty: 0, multiplier: 1, isLocked: false }]);
            const updateItem = (id, field, value) => setItems(items.map(i => i.id === id ? { ...i, [field]: value } : i));
            const removeItem = (id) => setItems(items.filter(i => i.id !== id));
            const clearAll = () => setItems([{ id: Date.now(), type: 'pack', packId: packSizes[0]?.id, qty: 0, multiplier: 1, isLocked: false }]);

            const total = useMemo(() => items.reduce((sum, item) => sum + (item.type === 'pack' ? (Number(item.qty) * (Number(item.multiplier)||1) * (packSizes.find(x => x.id === item.packId)?.size || 0)) : (Number(item.qty) * (Number(item.multiplier)||1))), 0), [items, packSizes]);

            const handleSave = () => {
                if (!saveName.trim()) { showToast("Vui lòng nhập tên để lưu!"); return; }
                const formula = generateFormulaString(items, packSizes);
                const finalStr = formula ? `${formula} = ${formatVN(total)}` : '0';
                setHistoryList([{ id: Date.now(), name: saveName, date: new Date().toLocaleString('vi-VN'), data: items, total, formulaStr: finalStr }, ...historyList]);
                setSaveName(''); showToast("Đã lưu thành công");
            };

            const loadHistory = (entry) => { setItems(entry.data); setShowHistory(false); showToast(`Đã tải: ${entry.name}`); };
            const deleteHistory = (id) => setHistoryList(historyList.filter(h => h.id !== id));

            return (
                <div className="p-4 space-y-5 fade-in">
                    {/* Thẻ Card Trắng Lớn (Chuẩn Apple Health style) */}
                    <div className="bg-white rounded-[32px] p-5 shadow-[0_4px_24px_rgba(0,0,0,0.04)] flex flex-col gap-5 relative">
                        <div className="flex justify-between items-start">
                            <div className="flex flex-col">
                                <span className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1">Tổng Thành Phẩm</span>
                                <span className="text-[44px] leading-none font-black text-blue-600 truncate max-w-[250px]">{total === 0 ? "0" : formatVN(total)}</span>
                            </div>
                            <button onClick={clearAll} className="w-10 h-10 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center active:bg-slate-200"><Icon name="rotate-ccw" size={18}/></button>
                        </div>
                        
                        {/* Thanh công cụ lưu */}
                        <div className="flex bg-slate-50 rounded-[20px] p-1.5 border border-slate-100">
                            <input type="text" placeholder="Tên đơn hàng..." value={saveName} onChange={(e) => setSaveName(e.target.value)} className="flex-1 px-3 bg-transparent outline-none font-semibold text-[14px] text-slate-800" />
                            <button onClick={handleSave} className="w-12 h-10 bg-blue-600 text-white rounded-[16px] shadow-sm flex items-center justify-center active:scale-95 transition-transform"><Icon name="save" size={18}/></button>
                            <button onClick={() => setShowHistory(true)} className="w-12 h-10 bg-white text-slate-600 rounded-[16px] shadow-sm ml-1 border border-slate-200 flex items-center justify-center active:scale-95 transition-transform"><Icon name="history" size={18}/></button>
                        </div>
                    </div>

                    <div className="flex gap-3">
                        <button onClick={() => addItem('pack')} className="flex-1 py-4 bg-white shadow-sm text-blue-600 text-[14px] font-bold rounded-[24px] flex items-center justify-center gap-2 active:bg-slate-50 transition-colors"><Icon name="box" size={18}/> Thêm Hộp</button>
                        <button onClick={() => addItem('single')} className="flex-1 py-4 bg-white shadow-sm text-orange-600 text-[14px] font-bold rounded-[24px] flex items-center justify-center gap-2 active:bg-slate-50 transition-colors"><Icon name="layers" size={18}/> Thêm Lẻ</button>
                    </div>

                    <div className="space-y-3">
                        {items.map(item => (
                            <RowItem key={item.id} item={item} packSizes={packSizes} updateItem={updateItem} removeItem={removeItem} />
                        ))}
                    </div>

                    {showHistory && <HistoryModal type="Tính Xuôi" historyList={historyList} close={() => setShowHistory(false)} loadHistory={loadHistory} deleteHistory={deleteHistory} />}
                </div>
            );
        }

        // --- TAB 2: CHIA NGƯỢC ---
        function Tab2Divider({ packSizes, showToast }) {
            const [targetTotal, setTargetTotal] = useState(() => {
                const saved = localStorage.getItem('tab2Total'); return saved ? parseInt(saved) : 0;
            });
            const [allocations, setAllocations] = useState(() => {
                const saved = localStorage.getItem('tab2Allocs');
                return saved ? JSON.parse(saved) : [{ id: Date.now(), type: 'pack', packId: packSizes[0]?.id || '', qty: 0, multiplier: 1, isLocked: false }];
            });
            
            const [showInputHelper, setShowInputHelper] = useState(false);
            const [helperPacks, setHelperPacks] = useState([{ id: Date.now(), packId: packSizes[0]?.id, qty: 0 }]);
            const [helperSingles, setHelperSingles] = useState(0);

            const [showSuggestModal, setShowSuggestModal] = useState(false);
            const [manualPackSelect, setManualPackSelect] = useState(packSizes[0]?.id);

            const [saveName, setSaveName] = useState('');
            const [showHistory, setShowHistory] = useState(false);
            const [historyList, setHistoryList] = useState(() => {
                const saved = localStorage.getItem('tab2History'); return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => { localStorage.setItem('tab2Total', targetTotal); }, [targetTotal]);
            useEffect(() => { localStorage.setItem('tab2Allocs', JSON.stringify(allocations)); }, [allocations]);
            useEffect(() => { localStorage.setItem('tab2History', JSON.stringify(historyList)); }, [historyList]);

            useEffect(() => {
                if(!showInputHelper) return;
                let sum = parseInt(helperSingles) || 0;
                helperPacks.forEach(p => { sum += (parseInt(p.qty) || 0) * (packSizes.find(x => x.id === p.packId)?.size || 0); });
                setTargetTotal(sum);
            }, [helperPacks, helperSingles, packSizes, showInputHelper]);

            const currentSum = allocations.reduce((sum, a) => sum + (a.type === 'pack' ? Number(a.qty) * (Number(a.multiplier)||1) * (packSizes.find(p => p.id === a.packId)?.size || 1) : Number(a.qty) * (Number(a.multiplier)||1)), 0);
            const unallocated = targetTotal - currentSum;

            const updateAlloc = (id, field, value) => setAllocations(allocations.map(a => a.id === id ? { ...a, [field]: value } : a));
            const removeAlloc = (id) => setAllocations(allocations.filter(a => a.id !== id));
            
            const addPack = () => setAllocations([...allocations, { id: Date.now() + Math.random(), type: 'pack', packId: packSizes[0]?.id, qty: 0, multiplier: 1, isLocked: false }]);
            const addSingle = () => setAllocations([...allocations, { id: Date.now() + Math.random(), type: 'single', qty: 0, multiplier: 1, isLocked: false }]);
            
            const clearAll = () => {
                setTargetTotal(0);
                setAllocations([{ id: Date.now(), type: 'pack', packId: packSizes[0]?.id, qty: 0, multiplier: 1, isLocked: false }]);
                showToast("Đã làm mới");
            };

            const handleSave = () => {
                if (!saveName.trim()) { showToast("Vui lòng nhập tên để lưu!"); return; }
                const formula = generateFormulaString(allocations, packSizes);
                let finalStr = formula ? `${formula} = ${formatVN(currentSum)}` : '0';
                if(unallocated !== 0) finalStr += ` (Dư: ${formatVN(unallocated)})`;

                setHistoryList([{ id: Date.now(), name: saveName, date: new Date().toLocaleString('vi-VN'), data: allocations, total: targetTotal, formulaStr: finalStr }, ...historyList]);
                setSaveName(''); showToast("Đã lưu thành công");
            };

            const loadHistory = (entry) => { setAllocations(entry.data); setTargetTotal(entry.total); setShowHistory(false); showToast(`Đã tải: ${entry.name}`); };
            const deleteHistory = (id) => setHistoryList(historyList.filter(h => h.id !== id));

            const handleSmartFillClick = () => {
                if (unallocated <= 0) return;
                const emptyRows = allocations.filter(a => a.type === 'pack' && Number(a.qty) === 0 && !a.isLocked);

                if (emptyRows.length > 0) {
                    let currentRem = unallocated;
                    let newAllocs = [...allocations];
                    
                    emptyRows.forEach(emptyRow => {
                        if (currentRem <= 0) return;
                        const idx = newAllocs.findIndex(a => a.id === emptyRow.id);
                        const packInfo = packSizes.find(p => p.id === emptyRow.packId);
                        if (packInfo && idx !== -1) {
                            const mult = Number(emptyRow.multiplier) || 1;
                            const capacity = packInfo.size * mult;
                            const fitQty = Math.floor(currentRem / capacity);
                            if (fitQty > 0) {
                                newAllocs[idx] = { ...newAllocs[idx], qty: fitQty };
                                currentRem -= (fitQty * capacity);
                            }
                        }
                    });

                    if (currentRem > 0) {
                         const singleIdx = newAllocs.findIndex(a => a.type === 'single' && !a.isLocked && (Number(a.multiplier)||1) === 1);
                         if (singleIdx !== -1) {
                             newAllocs[singleIdx] = { ...newAllocs[singleIdx], qty: Number(newAllocs[singleIdx].qty) + currentRem };
                         } else {
                             newAllocs.push({ id: Date.now() + Math.random(), type: 'single', qty: currentRem, multiplier: 1, isLocked: false });
                         }
                    }
                    setAllocations(newAllocs);
                    showToast("Đã tự động xếp!");
                } else {
                    setShowSuggestModal(true);
                }
            };

            const applyManualPack = () => {
                const pack = packSizes.find(p => p.id === manualPackSelect);
                if(!pack) return;
                const q = Math.floor(unallocated / pack.size);
                if(q > 0) {
                    setAllocations([...allocations, { id: Date.now() + Math.random(), type: 'pack', packId: pack.id, qty: q, multiplier: 1, isLocked: false }]);
                } else {
                    showToast("Số dư không đủ 1 hộp!");
                }
                setShowSuggestModal(false);
            };

            return (
                <div className="p-4 space-y-5 fade-in">
                    {/* Thẻ Nhập Tổng Cao Cấp */}
                    <div className="bg-white rounded-[32px] p-5 shadow-[0_4px_24px_rgba(0,0,0,0.04)] flex flex-col gap-4">
                        <div className="flex justify-between items-start">
                            <div className="flex flex-col flex-1 pr-2">
                                <span className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-2">
                                    Tổng cần chia
                                    <button onClick={() => setShowInputHelper(!showInputHelper)} className="text-[10px] text-blue-500 font-bold bg-blue-50 px-2 py-0.5 rounded-full flex items-center gap-1">
                                        <Icon name={showInputHelper ? "chevron-up" : "plus"} size={10}/> Kho
                                    </button>
                                </span>
                                <input 
                                    type="text" inputMode="numeric" pattern="[0-9]*" 
                                    value={targetTotal === 0 ? '' : formatVN(targetTotal)} 
                                    onChange={(e) => { setTargetTotal(parseVN(e.target.value)); setShowInputHelper(false); }} 
                                    onFocus={(e) => e.target.select()}
                                    placeholder="0"
                                    className="w-full text-left text-[44px] font-black text-blue-600 outline-none bg-transparent"
                                />
                            </div>
                            <button onClick={clearAll} className="w-10 h-10 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center shrink-0 active:bg-slate-200"><Icon name="rotate-ccw" size={18}/></button>
                        </div>
                        
                        {/* Công cụ tính kho mở rộng */}
                        {showInputHelper && (
                            <div className="bg-slate-50 rounded-[20px] p-3 space-y-2 border border-slate-100 fade-in">
                                {helperPacks.map(hp => (
                                    <div key={hp.id} className="flex gap-2">
                                        <select value={hp.packId} onChange={(e) => setHelperPacks(helperPacks.map(p => p.id === hp.id ? {...p, packId: e.target.value} : p))} className="flex-1 bg-white border border-slate-200 shadow-sm rounded-[16px] text-[14px] font-bold text-slate-700 px-3 outline-none">
                                            {packSizes.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                        </select>
                                        <input 
                                            type="text" inputMode="numeric" pattern="[0-9]*" placeholder="SL" 
                                            value={hp.qty===0?'':formatVN(hp.qty)} 
                                            onChange={(e)=>setHelperPacks(helperPacks.map(p => p.id === hp.id ? {...p, qty: parseVN(e.target.value)} : p))} 
                                            onFocus={(e) => e.target.select()}
                                            className="w-20 bg-white border border-slate-200 shadow-sm rounded-[16px] text-center font-bold text-[15px] text-slate-800 outline-none py-2.5" 
                                        />
                                    </div>
                                ))}
                                <div className="flex gap-2 mt-2 items-center">
                                    <button onClick={() => setHelperPacks([...helperPacks, { id: Date.now(), packId: packSizes[0]?.id, qty: 0 }])} className="text-[12px] text-blue-600 bg-blue-50 py-2 px-3 rounded-[12px] font-bold active:bg-blue-100">Thêm Hộp</button>
                                    <div className="flex-1 flex items-center gap-2 border-l border-slate-200 pl-2">
                                        <span className="text-[11px] text-slate-500 font-bold uppercase">Lẻ:</span>
                                        <input 
                                            type="text" inputMode="numeric" pattern="[0-9]*" placeholder="0"
                                            value={helperSingles===0?'':formatVN(helperSingles)} 
                                            onChange={(e)=>setHelperSingles(parseVN(e.target.value))} 
                                            onFocus={(e) => e.target.select()}
                                            className="flex-1 bg-white border border-slate-200 shadow-sm rounded-[12px] text-center font-bold text-[15px] py-2 outline-none text-slate-700" 
                                        />
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="flex bg-slate-50 rounded-[20px] p-1.5 border border-slate-100">
                            <input type="text" placeholder="Tên đơn hàng..." value={saveName} onChange={(e) => setSaveName(e.target.value)} className="flex-1 px-3 bg-transparent outline-none font-semibold text-[14px] text-slate-800" />
                            <button onClick={handleSave} className="w-12 h-10 bg-blue-600 text-white rounded-[16px] shadow-sm flex items-center justify-center active:scale-95 transition-transform"><Icon name="save" size={18}/></button>
                            <button onClick={() => setShowHistory(true)} className="w-12 h-10 bg-white text-slate-600 rounded-[16px] shadow-sm ml-1 border border-slate-200 flex items-center justify-center active:scale-95 transition-transform"><Icon name="history" size={18}/></button>
                        </div>
                    </div>

                    {/* Thẻ Báo Dư/Thiếu Lớn Rõ Ràng */}
                    <div 
                        onClick={() => { if (unallocated > 0) handleSmartFillClick(); }}
                        className={`p-5 rounded-[28px] flex items-center justify-between shadow-sm transition-all ${unallocated === 0 ? 'bg-emerald-500' : unallocated > 0 ? 'bg-amber-500 cursor-pointer active:scale-95' : 'bg-rose-500'}`}
                    >
                        <div className="flex flex-col text-white">
                            <span className="text-[12px] font-bold uppercase tracking-wider opacity-90">
                                {unallocated === 0 ? 'Hoàn thành' : unallocated > 0 ? 'Chưa xếp (Bấm để gộp)' : 'Lỗi: Bị Âm'}
                            </span>
                            <span className="text-[32px] font-black leading-none mt-1">
                                {Math.abs(unallocated) === 0 ? "0" : formatVN(Math.abs(unallocated))}
                            </span>
                        </div>
                        {unallocated > 0 && <div className="w-12 h-12 bg-white/20 rounded-full flex justify-center items-center text-white"><Icon name="wand-2" size={24}/></div>}
                        {unallocated === 0 && <div className="w-12 h-12 bg-white/20 rounded-full flex justify-center items-center text-white"><Icon name="check" size={24}/></div>}
                    </div>

                    <div className="flex gap-3">
                        <button onClick={addPack} className="flex-1 py-4 bg-white shadow-sm text-blue-600 text-[14px] font-bold rounded-[24px] flex items-center justify-center gap-2 active:bg-slate-50 transition-colors"><Icon name="box" size={18}/> Hộp Mới</button>
                        <button onClick={addSingle} className="flex-1 py-4 bg-white shadow-sm text-orange-600 text-[14px] font-bold rounded-[24px] flex items-center justify-center gap-2 active:bg-slate-50 transition-colors"><Icon name="layers" size={18}/> Lẻ Mới</button>
                    </div>

                    <div className="space-y-3">
                        {allocations.map((alloc) => (
                            <RowItem key={alloc.id} item={alloc} packSizes={packSizes} updateItem={updateAlloc} removeItem={removeAlloc} />
                        ))}
                    </div>

                    {showHistory && <HistoryModal type="Chia Ngược" historyList={historyList} close={() => setShowHistory(false)} loadHistory={loadHistory} deleteHistory={deleteHistory} />}

                    {/* MODAL GỢI Ý ĐŨA THẦN MỚI */}
                    {showSuggestModal && (
                        <div className="fixed inset-0 bg-slate-900/40 z-[60] flex items-end fade-in">
                            <div className="bg-white rounded-t-[40px] p-6 w-full shadow-2xl slide-up-modal pb-[calc(env(safe-area-inset-bottom,20px)+20px)]">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="font-bold text-slate-800 text-xl flex items-center gap-2">Chỉ định Hộp</h3>
                                    <button onClick={() => setShowSuggestModal(false)} className="w-8 h-8 bg-slate-100 text-slate-600 rounded-full flex justify-center items-center"><Icon name="x" size={18}/></button>
                                </div>
                                <div className="space-y-4">
                                    <div className="bg-slate-50 rounded-[20px] p-4 flex justify-between items-center border border-slate-100">
                                        <span className="text-slate-500 font-semibold">Phần dư cần chia:</span>
                                        <span className="text-2xl font-black text-amber-600">{formatVN(unallocated)}</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <select value={manualPackSelect} onChange={(e) => setManualPackSelect(e.target.value)} className="flex-1 bg-white border border-slate-200 rounded-[20px] px-4 outline-none font-bold text-[16px] text-blue-700 shadow-sm h-14">
                                            {packSizes.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={applyManualPack} className="w-full h-14 bg-blue-600 text-white font-bold text-[16px] rounded-[20px] active:bg-blue-700 shadow-md">
                                        Tự động xếp vào hộp này
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- ROW ITEM (THIẾT KẾ CLEAN UI, KHÔNG OVERLAP) ---
        function RowItem({ item, packSizes, updateItem, removeItem }) {
            const isPack = item.type === 'pack';
            const mult = Number(item.multiplier) || 1;
            const qtyNum = Number(item.qty) || 0;
            const itemTotal = isPack ? (qtyNum * mult * (packSizes.find(p => p.id === item.packId)?.size || 0)) : (qtyNum * mult);
            const isWaiting = qtyNum === 0;
            
            const packName = isPack ? (packSizes.find(p => p.id === item.packId)?.name || 'Hộp') : 'Hàng Lẻ';

            return (
                <div className={`flex flex-col gap-3 p-3.5 rounded-[28px] border transition-colors shadow-sm ${item.isLocked ? 'bg-slate-100 border-slate-200 opacity-60' : (isWaiting ? 'bg-white border-amber-300 shadow-amber-100/50' : 'bg-white border-transparent')}`}>
                    <div className="flex justify-between items-center gap-2">
                        <RowMultiplier multiplier={mult} setMultiplier={(v) => updateItem(item.id, 'multiplier', v)} packName={packName} />
                        
                        <div className="flex-1">
                            {isPack ? (
                                <select disabled={item.isLocked} value={item.packId} onChange={(e) => updateItem(item.id, 'packId', e.target.value)} className={`w-full bg-transparent text-[16px] font-bold ${item.isLocked ? 'text-slate-500' : 'text-slate-800'} outline-none appearance-none`}>
                                    {packSizes.map(p => <option key={p.id} value={p.id}>{p.name} ({formatVN(p.size)})</option>)}
                                </select>
                            ) : (
                                <span className={`text-[16px] font-bold ${item.isLocked ? 'text-slate-500' : 'text-orange-600'}`}>Hàng Lẻ</span>
                            )}
                        </div>
                        
                        <div className="text-right">
                            <span className={`text-[18px] font-black ${isPack ? 'text-blue-600' : 'text-orange-600'}`}>{itemTotal === 0 ? "0" : formatVN(itemTotal)}</span>
                        </div>
                    </div>
                    
                    <div className="flex justify-between items-center">
                        <div className={`flex items-center rounded-[20px] overflow-hidden bg-slate-100 h-12 w-[140px] ${item.isLocked ? 'opacity-50 pointer-events-none' : ''}`}>
                            <button onClick={() => updateItem(item.id, 'qty', Math.max(0, qtyNum - 1))} className="w-12 h-full flex items-center justify-center text-slate-600 hover:bg-slate-200 active:bg-slate-300 font-black text-xl">-</button>
                            <input 
                                type="text" inputMode="numeric" pattern="[0-9]*" 
                                value={item.qty===0?'':formatVN(item.qty)} 
                                onChange={(e) => updateItem(item.id, 'qty', parseVN(e.target.value))}
                                onFocus={(e) => e.target.select()}
                                placeholder="0"
                                className="flex-1 w-full h-full text-center text-[18px] font-black bg-white outline-none p-0" 
                            />
                            <button onClick={() => updateItem(item.id, 'qty', qtyNum + 1)} className="w-12 h-full flex items-center justify-center text-slate-600 hover:bg-slate-200 active:bg-slate-300 font-black text-xl">+</button>
                        </div>
                        
                        <div className="flex gap-2">
                            <button onClick={() => updateItem(item.id, 'isLocked', !item.isLocked)} className={`w-12 h-12 rounded-[18px] flex items-center justify-center transition-colors ${item.isLocked ? 'bg-amber-100 text-amber-600' : 'bg-slate-50 text-slate-400 active:bg-slate-100'}`}><Icon name={item.isLocked ? 'lock' : 'unlock'} size={18} /></button>
                            <button onClick={() => removeItem(item.id)} className="w-12 h-12 rounded-[18px] flex items-center justify-center bg-rose-50 text-rose-500 active:bg-rose-100 transition-colors"><Icon name="trash-2" size={18}/></button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENT MODAL LỊCH SỬ CHUNG ---
        const HistoryModal = ({ type, historyList, close, loadHistory, deleteHistory }) => (
            <div className="fixed inset-0 bg-slate-900/40 z-[100] flex flex-col fade-in">
                <div className="bg-white pt-[env(safe-area-inset-top,20px)] pb-2 px-4 flex justify-between items-center border-b border-slate-200 shadow-sm">
                    <h3 className="font-bold text-slate-800 text-lg">Lịch sử {type}</h3>
                    <button onClick={close} className="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center"><Icon name="x" size={18}/></button>
                </div>
                <div className="flex-1 overflow-y-auto p-4 bg-[#F2F2F7] space-y-4 pb-[calc(env(safe-area-inset-bottom,20px)+20px)]">
                    {historyList.length === 0 ? <p className="text-center text-slate-500 mt-10 font-medium">Chưa có dữ liệu lịch sử.</p> : historyList.map(entry => (
                        <div key={entry.id} className="bg-white p-4 rounded-[24px] shadow-sm flex flex-col gap-3">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="font-bold text-slate-800 text-[16px]">{entry.name}</p>
                                    <p className="text-[11px] text-slate-400 font-medium mt-0.5">{entry.date}</p>
                                </div>
                                <span className="text-[13px] font-black text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">Tổng: {formatVN(entry.total)}</span>
                            </div>
                            <div className="bg-slate-50 p-3 rounded-[16px] text-[13px] font-mono font-medium text-slate-600 leading-relaxed">
                                {entry.formulaStr}
                            </div>
                            <div className="flex gap-2 pt-1">
                                <button onClick={() => loadHistory(entry)} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-[16px] active:bg-slate-200 flex items-center justify-center gap-1.5"><Icon name="download" size={16}/> Mở lại</button>
                                <button onClick={() => deleteHistory(entry.id)} className="w-14 bg-rose-50 text-rose-500 rounded-[16px] active:bg-rose-100 flex items-center justify-center"><Icon name="trash-2" size={18}/></button>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        // --- TAB 3: SETTINGS ---
        function Tab3Settings({ packSizes, setPackSizes }) {
            const [newName, setNewName] = useState('');
            const [newSize, setNewSize] = useState('');
            const [showUpdate, setShowUpdate] = useState(true);
            
            const handleAdd = () => {
                if (newName && newSize) {
                    setPackSizes([...packSizes, { id: 'p' + Date.now(), name: newName, size: parseVN(newSize) }]);
                    setNewName(''); setNewSize('');
                }
            };
            return (
                <div className="p-4 space-y-5 fade-in">
                    {/* THÔNG BÁO CẬP NHẬT ĐÃ ĐƯỢC KHÔI PHỤC VÀ LÀM ĐẸP */}
                    {showUpdate && (
                        <div className="bg-gradient-to-br from-blue-500 to-indigo-600 p-5 rounded-[28px] shadow-lg text-white flex flex-col gap-2 relative overflow-hidden">
                            <div className="absolute -right-4 -bottom-4 opacity-10"><Icon name="rocket" size={120}/></div>
                            <h3 className="font-black text-[18px] z-10">Bản Cập Nhật V14.0 Pro</h3>
                            <p className="text-blue-50 text-[12px] z-10 leading-relaxed font-medium">Giao diện chuẩn Apple, không đè lấp. Định dạng số 12.000 mượt mà. Hệ số x1 popup thông minh.</p>
                            <button onClick={() => setShowUpdate(false)} className="mt-2 text-[12px] font-bold bg-white text-indigo-600 px-4 py-2 rounded-full w-fit z-10 shadow-sm active:scale-95">Tuyệt vời!</button>
                        </div>
                    )}

                    <div className="bg-white rounded-[32px] shadow-sm p-5">
                        <h3 className="font-bold text-slate-400 text-[12px] uppercase tracking-widest mb-4">Cấu hình Hộp / Thùng</h3>
                        <div className="space-y-3">
                            {packSizes.map(pack => (
                                <div key={pack.id} className="flex justify-between items-center bg-slate-50 p-3.5 rounded-[20px] border border-slate-100">
                                    <div>
                                        <p className="font-bold text-slate-800 text-[16px]">{pack.name}</p>
                                        <p className="text-[12px] text-blue-600 font-bold mt-1">1 hộp = {formatVN(pack.size)}</p>
                                    </div>
                                    <button onClick={() => setPackSizes(packSizes.filter(p => p.id !== pack.id))} className="w-10 h-10 bg-white text-rose-500 rounded-full shadow-sm flex items-center justify-center active:scale-90" disabled={packSizes.length <= 1}><Icon name="trash-2" size={16} /></button>
                                </div>
                            ))}
                        </div>
                        <div className="mt-6 pt-6 border-t border-slate-100">
                            <div className="flex gap-2">
                                <input type="text" placeholder="Tên Hộp" value={newName} onChange={e => setNewName(e.target.value)} className="flex-1 bg-slate-50 border border-slate-200 rounded-[16px] px-4 h-12 text-[14px] outline-none font-semibold text-slate-800 focus:bg-white transition-colors" />
                                <input type="text" inputMode="numeric" pattern="[0-9]*" placeholder="S.Lượng" value={newSize===0?'':formatVN(newSize)} onChange={e => setNewSize(parseVN(e.target.value))} className="w-24 bg-slate-50 border border-slate-200 rounded-[16px] h-12 text-[15px] outline-none text-center font-black text-slate-800 focus:bg-white transition-colors" />
                                <button onClick={handleAdd} className="w-14 h-12 bg-slate-800 text-white rounded-[16px] active:scale-95 flex items-center justify-center"><Icon name="plus" size={20}/></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
